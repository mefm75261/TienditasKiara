<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tienditas Kiara</title>
<link rel="icon" type="image/png" href="img/Logo tienditas kiara.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<style>
  :root{
    --paper:#FBE9F2;
    --card:#FFFFFF;
    --ink:#5B2A4D;
    --ink-soft:#9C6E93;
    --brick:#C15B95;
    --brick-dark:#9E3F78;
    --mustard:#F7AFCE;
    --sage:#8A5AA8;
    --line:#F3CFE3;
    --shadow: 0 1px 2px rgba(91,42,77,0.08), 0 10px 26px -10px rgba(155,64,120,0.28);
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Public Sans', sans-serif;
    font-size:17px;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .app{max-width:none;width:100%;margin:0;padding:16px 10px 40px;}
  .num{font-family:'Space Mono', monospace;}

  /* header */
  header.top{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:6px 2px 18px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .mark{
    width:52px;height:52px;border-radius:50%;background:#fff;
    display:flex;align-items:center;justify-content:center;flex:0 0 auto;
    box-shadow: var(--shadow); overflow:hidden; border:2.5px solid var(--mustard);
  }
  .brand .mark img{width:100%;height:100%;object-fit:cover;}
  .shopname{
    font-family:'Fraunces', serif; font-weight:700; font-size:2.1rem; color:var(--ink);
    margin:0; padding:2px 6px;
  }
  .tagline{color:var(--ink-soft); font-size:0.9rem; letter-spacing:.02em; font-weight:600; margin:0 0 14px 2px;}
  .io-actions{display:flex; gap:8px; flex-wrap:wrap;}
  .mascota-header{ height:46px; width:auto; margin-left:4px; }

  /* nav */
  nav.tabs{
    display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; margin-bottom:18px;
    border-bottom:1px solid var(--line);
  }
  nav.tabs button{
    font-family:'Public Sans', sans-serif; font-weight:700; font-size:0.98rem;
    color:var(--ink-soft); background:transparent; border:none; cursor:pointer;
    padding:11px 16px; border-radius:10px 10px 0 0; white-space:nowrap;
    position:relative; top:1px;
  }
  nav.tabs button.active{
    color:var(--brick); background:var(--card);
    border:1px solid var(--line); border-bottom:1px solid var(--card);
    box-shadow: 0 -2px 0 var(--brick) inset;
  }

  nav.tabs a.modo-buscar{
  font-family:'Public Sans', sans-serif; font-weight:700; font-size:0.98rem;
  color:#146C82; background:#DFF3F8; border:none; cursor:pointer;
  padding:11px 16px; border-radius:10px 10px 0 0; white-space:nowrap;
  position:relative; top:1px; text-decoration:none; margin-left:auto;
  display:flex; align-items:center; gap:6px;
}
nav.tabs a.modo-buscar:hover{ background:#CDEBF2; }

  h2.section-title{font-family:'Fraunces', serif; font-weight:700; font-size:1.4rem; margin:0 0 14px;}
  .muted{color:var(--ink-soft);}

  .card{
    background:var(--card); border:2px dashed var(--line); border-radius:var(--radius);
    padding:20px; box-shadow:var(--shadow); margin-bottom:18px; position:relative;
  }
  .card::before{
    content:"✿"; position:absolute; top:-11px; left:18px; background:var(--paper);
    color:var(--brick); font-size:1rem; padding:0 6px; line-height:1;
  }
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media (max-width:560px){ .grid2{grid-template-columns:1fr;} }

  label{display:block; font-size:0.76rem; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); margin-bottom:5px; font-weight:700;}
  input[type=text], input[type=number], input[type=date], select{
    width:100%; padding:11px 13px; border-radius:10px; border:1.5px solid var(--line);
    background:#FFFCFE; color:var(--ink); font-size:1rem; font-family:'Public Sans', sans-serif;
    outline:none;
  }
  input[type=text]:focus, input[type=number]:focus, select:focus{ border-color:var(--brick); box-shadow:0 0 0 3px rgba(181,68,44,0.12); }
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  input[type=number]{ -moz-appearance:textfield; appearance:textfield; }

  .field{position:relative; margin-bottom:12px;}

  .autolist{
    position:absolute; left:0; right:0; top:calc(100% + 4px); z-index:30;
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    box-shadow:var(--shadow); max-height:220px; overflow:auto; padding:4px;
  }
  .autolist .opt{
    padding:11px 12px; border-radius:8px; cursor:pointer; font-size:1rem;
    display:flex; justify-content:space-between; gap:10px;
  }
  .autolist .opt:hover, .autolist .opt.hi{ background:#FCE3F0; }
  .autolist .opt .p{color:var(--ink-soft); font-family:'Space Mono',monospace; font-size:0.82rem;}
  .autolist .opt.new{color:var(--brick); font-weight:600;}
  .autolist .empty{padding:9px 10px; color:var(--ink-soft); font-size:0.85rem;}

  .btn{
    font-family:'Public Sans', sans-serif; font-weight:700; font-size:0.95rem;
    padding:11px 18px; border-radius:10px; border:1.5px solid transparent; cursor:pointer;
    display:inline-flex; align-items:center; gap:6px;
    position:relative; overflow:hidden; isolation:isolate;
  }
  .btn::after{
    content:""; position:absolute; top:0; left:-60%; width:35%; height:100%; z-index:1;
    background:linear-gradient(120deg, transparent 0%, rgba(255,255,255,0.32) 50%, transparent 100%);
    transform:skewX(-20deg); pointer-events:none;
    animation: btnGlowSweep 9s ease-in-out infinite;
  }
  @keyframes btnGlowSweep{
    0%{ left:-60%; }
    7%{ left:130%; }
    100%{ left:130%; }
  }
  .btn-primary::after{ animation-delay:0s; }
  .btn-ghost::after{ animation-delay:3.2s; }
  .btn-primary{ background:var(--brick); color:#FFF7FB; }
  .btn-primary:hover{ background:var(--brick-dark); }
  .btn-ghost{ background:transparent; color:var(--ink); border-color:var(--line); }
  .btn-ghost:hover{ background:#FCEEF6; }
  .btn-danger{ background:transparent; color:var(--brick-dark); border-color:transparent; font-weight:700; font-size:0.85rem; padding:6px 8px;}
  .btn-danger:hover{ text-decoration:underline; }
  .btn-sm{ padding:7px 12px; font-size:0.82rem; }

  .btn-toggle-embolsado{
    font-family:'Public Sans', sans-serif; font-weight:700; font-size:0.8rem;
    padding:8px 14px; border-radius:10px; border:1.5px solid var(--line);
    background:transparent; color:var(--ink-soft); cursor:pointer;
  }
  .btn-toggle-embolsado:hover{ border-color:#4AA9C2; }
  .btn-toggle-embolsado.on{ background:#4AA9C2; border-color:#4AA9C2; color:#fff; }
  .btn[disabled]{opacity:0.4; cursor:not-allowed;}

  /* cart table */
  table{width:100%; border-collapse:collapse;}
  table.cart th{ text-align:left; font-size:0.72rem; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); padding:6px 8px; border-bottom:1px solid var(--line);}
  table.cart td{ padding:11px 8px; border-bottom:1px dashed var(--line); font-size:1.02rem; vertical-align:middle;}
  table.cart tr:last-child td{border-bottom:none;}
  table.cart td.num, table.cart th.num{text-align:right;}
  .qty-x{color:var(--ink-soft); font-size:0.85rem;}

  .cliente-chip{
    display:inline-flex; align-items:center; gap:8px; background:#FCE3F0; border:1px solid var(--line);
    padding:8px 14px; border-radius:999px; font-weight:700; font-size:1rem;
  }
  .cliente-chip .zona{ color:var(--ink-soft); font-weight:500; font-size:0.85rem;}
  .cliente-chip button{ background:none; border:none; cursor:pointer; color:var(--ink-soft); font-size:1rem; line-height:1;}

  .totals-row{display:flex; justify-content:space-between; padding:6px 2px; font-size:1.02rem;}
  .totals-row.total{ font-weight:700; font-size:1.05rem; border-top:1px solid var(--line); margin-top:6px; padding-top:10px;}

  .empty-state{ text-align:center; padding:34px 10px; color:var(--ink-soft); }
  .empty-state .big{font-family:'Fraunces',serif; font-size:1.2rem; color:var(--ink); margin-bottom:4px;}

  /* simple table for admin lists */
  table.admin{width:100%; border-collapse:collapse;}
  table.admin th{text-align:left; font-size:0.72rem; text-transform:uppercase; color:var(--ink-soft); padding:6px 8px; border-bottom:1px solid var(--line);}
  table.admin td{padding:11px 8px; border-bottom:1px solid var(--line); font-size:1rem;}
  table.admin input{padding:8px 10px; font-size:0.98rem;}

  table.tabla-plana{width:100%; border-collapse:collapse; margin-top:4px; font-size:0.85rem;}
  table.tabla-plana th{text-align:left; font-size:0.68rem; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-soft); padding:6px 6px; border-bottom:1px solid var(--ink);}
  table.tabla-plana th.num, table.tabla-plana td.num{text-align:right;}
  table.tabla-plana td{padding:5px 6px; border-bottom:1px dashed var(--line); vertical-align:middle;}
  table.tabla-plana tr.row-bagged{background:rgba(143,206,223,0.12);}
  table.tabla-plana tr.row-bagged td{color:#4AA9C2;}
  table.tabla-plana input[type=text], table.tabla-plana input[type=number]{
    padding:4px 6px; font-size:0.83rem; width:100%; min-width:60px;
  }
  table.tabla-plana input[type=checkbox]{width:16px; height:16px;}
  table.tabla-plana .btn-danger{font-size:0.75rem; padding:2px 6px;}

  .row-inline{display:flex; gap:8px; align-items:flex-end; flex-wrap:wrap;}
  .row-inline > div{flex:1; min-width:120px;}

  /* boleta overlay */
  .overlay{
    position:fixed; inset:0; background:rgba(43,36,28,0.55); display:flex;
    align-items:flex-start; justify-content:center; padding:30px 14px; z-index:100; overflow:auto;
    gap:16px; flex-wrap:wrap;
  }
  .boleta-wrap{ width:100%; max-width:380px; }
  .boleta{
    background:#FFFDFE; color:var(--ink); position:relative;
    padding:26px 22px 20px; margin-bottom:16px;
    box-shadow: 0 20px 40px -12px rgba(0,0,0,0.4);
    border-left:3px dashed var(--mustard); border-right:3px dashed var(--mustard);
  }
  .boleta::before, .boleta::after{
    content:""; position:absolute; left:0; right:0; height:12px;
    background:
      linear-gradient(135deg, var(--paper) 50%, transparent 50%) 0 0/16px 16px repeat-x,
      linear-gradient(-135deg, var(--paper) 50%, transparent 50%) 0 0/16px 16px repeat-x;
    background-color: transparent;
  }
  .boleta::before{ top:-1px; transform:translateY(-100%); }
  .boleta::after{ bottom:-1px; transform:translateY(100%); }
  .boleta .boleta-logo{ display:block; width:44px; height:44px; border-radius:50%; margin:0 auto 8px; object-fit:cover; border:2px solid var(--mustard); }
  .boleta h3{font-family:'Fraunces',serif; font-size:1.25rem; margin:0 0 2px; text-align:center;}
  .boleta .sub{text-align:center; color:var(--ink-soft); font-size:0.78rem; margin-bottom:14px;}
  .boleta hr{border:none; border-top:1px dashed var(--line); margin:12px 0;}
  .boleta .meta{font-size:0.82rem; display:flex; justify-content:space-between; margin-bottom:2px;}
  .boleta table{width:100%; border-collapse:collapse; margin-top:8px;}
  .boleta table th{font-size:0.68rem; text-transform:uppercase; text-align:left; color:var(--ink-soft); padding:4px 2px; border-bottom:1px solid var(--ink);}
  .boleta table td{font-size:0.85rem; padding:5px 2px; vertical-align:top;}
  .boleta.compacta table th{padding:2px 2px; font-size:0.6rem;}
  .boleta.compacta table td{padding:2px 2px; font-size:0.74rem;}
  .boleta.compacta hr{margin:6px 0;}
  .boleta.compacta .boleta-logo{width:32px; height:32px; margin-bottom:4px;}
  .boleta.compacta h3{font-size:1.05rem;}
  .boleta.compacta .sub{margin-bottom:8px;}
  .boleta.compacta .meta{font-size:0.72rem;}
  .boleta.compacta .totals-row{font-size:0.78rem;}
  .boleta.compacta .totals-row.total{font-size:0.95rem;}
  .boleta.compacta .thanks{margin-top:8px; font-size:0.7rem;}
  .boleta.compacta .boleta-mascota{max-height:44px; margin-top:4px;}
  .boleta table td.num{text-align:right; font-family:'Space Mono',monospace;}
  .boleta tr.orden-bagged td{ color:#4AA9C2; }
  .boleta .totals-row{font-size:0.88rem;}
  .boleta .totals-row.total{font-size:1.1rem; font-family:'Fraunces',serif; font-weight:700;}
  .boleta .totals-row.descuento{color:var(--brick-dark);}
  .boleta .thanks{text-align:center; margin-top:16px; font-size:0.8rem; color:var(--ink-soft); font-style:italic;}
  .boleta .boleta-mascota{ display:block; max-height:70px; width:auto; margin:10px auto 0; }
  .boleta [contenteditable]{ outline:none; cursor:text; }
  .boleta [contenteditable]:hover{ background:rgba(217,164,65,0.12); border-radius:3px; }
  .overlay-nav{ display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%; margin-bottom:4px; }
  .img-config-row{ display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px dashed var(--line); }
  .img-config-row:last-of-type{ border-bottom:none; }
  .img-config-preview{ width:44px; height:44px; border-radius:50%; object-fit:cover; border:2px solid var(--mustard); background:#fff; flex:0 0 auto; }
  .img-config-info{ flex:1 1 auto; display:flex; flex-direction:column; gap:2px; font-size:0.85rem; }
  .img-config-warn{ font-size:0.72rem; color:var(--brick-dark); }
  .img-config-ok{ font-size:0.72rem; color:#3d7a4a; }
  .overlay-nav-pos{ font-size:0.78rem; color:var(--ink-soft); white-space:nowrap; }
  .overlay-actions{
    display:flex; flex-direction:column; gap:10px; flex-wrap:nowrap;
    background:var(--card); padding:16px; border-radius:14px; box-shadow:var(--shadow);
    min-width:190px; align-self:flex-start; margin-top:0;
  }
  .overlay-actions .btn{ width:100%; justify-content:center; }
  @media (max-width:640px){
    .overlay{ flex-direction:column; align-items:center; }
    .overlay-actions{ flex-direction:row; flex-wrap:wrap; width:100%; max-width:380px; min-width:0; justify-content:center; }
    .overlay-actions .btn{ width:auto; flex:1 1 auto; }
  }

  /* pantalla de bienvenida */
  .landing{
    position:fixed; inset:0; z-index:300; display:flex; align-items:center; justify-content:center;
    padding:24px; overflow:auto;
    background:
      radial-gradient(circle at 15% 20%, rgba(217,164,65,0.25), transparent 45%),
      radial-gradient(circle at 85% 15%, rgba(181,68,44,0.18), transparent 40%),
      radial-gradient(circle at 50% 100%, rgba(247,175,206,0.5), transparent 55%),
      linear-gradient(160deg, #FCE8F1 0%, #FBD5E5 45%, #F7C9DF 100%);
  }
  .landing-card{
    background:rgba(255,253,254,0.9); backdrop-filter:blur(2px);
    border-radius:28px; padding:44px 36px 34px; max-width:420px; width:100%;
    text-align:center; box-shadow:0 30px 60px -20px rgba(91,42,77,0.35);
    border:2px dashed var(--mustard);
  }
  .landing-logo{
    width:96px; height:96px; border-radius:50%; object-fit:cover; margin:0 auto 14px;
    border:3px solid var(--mustard); box-shadow:0 8px 24px -8px rgba(91,42,77,0.4);
    display:block;
  }
  .landing-title{
    font-family:'Fraunces',serif; font-weight:700; font-size:2.4rem; margin:0 0 4px; color:var(--ink);
  }
  .landing-date{
    color:var(--brick-dark); font-weight:700; font-size:0.95rem; text-transform:capitalize; margin-bottom:6px;
  }
  .landing-sub{ color:var(--ink-soft); font-size:1rem; margin:6px 0 22px; }
  .landing-actions{ display:flex; flex-direction:column; gap:14px; }
  .landing-skip{
    margin-top:20px; background:none; border:none; color:var(--ink-soft); font-size:0.85rem;
    text-decoration:underline; cursor:pointer; font-family:'Public Sans', sans-serif;
  }
  .landing-skip:hover{ color:var(--brick); }

  /* botones con efecto shine */
  .btn-shine{
    position:relative; overflow:hidden; border:none; border-radius:14px; cursor:pointer;
    font-family:'Public Sans', sans-serif; font-weight:700; font-size:1.05rem;
    padding:16px 20px; display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn-shine::after{
    content:""; position:absolute; top:0; left:-75%; width:50%; height:100%;
    background:linear-gradient(120deg, transparent 0%, rgba(255,255,255,0.65) 50%, transparent 100%);
    transform:skewX(-20deg);
    animation:btnshine 3.2s ease-in-out infinite;
  }
  @keyframes btnshine{
    0%{ left:-75%; }
    35%{ left:130%; }
    100%{ left:130%; }
  }
  .btn-shine-primary{ background:linear-gradient(135deg, var(--brick) 0%, var(--brick-dark) 100%); color:#FFF7FB; box-shadow:0 10px 24px -8px rgba(181,68,44,0.55); }
  .btn-shine-primary:hover{ filter:brightness(1.06); }
  .btn-shine-ghost{ background:#FFFFFF; color:var(--ink); border:2px solid var(--line); box-shadow:0 6px 16px -8px rgba(91,42,77,0.25); }
  .btn-shine-ghost:hover{ border-color:var(--mustard); }
  .btn-shine-buscar{
  background:linear-gradient(135deg, #4AA9C2 0%, #2E7E96 100%); color:#FFFDFE;
  box-shadow:0 10px 24px -8px rgba(46,126,150,0.5); text-align:center;
  }
  .btn-shine-buscar:hover{ filter:brightness(1.06); }

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:999px;
    font-size:0.85rem; box-shadow:var(--shadow); z-index:200; opacity:0; pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}

  .live-legend{ display:flex; align-items:center; gap:6px; font-size:0.75rem; color:var(--ink-soft); }
  .live-legend-swatch{ width:10px; height:10px; border-radius:3px; background:#4AA9C2; display:inline-block; flex:0 0 auto; }
  .live-grid{ display:flex; align-items:flex-start; gap:14px; margin-top:2px; overflow-x:auto; padding-bottom:4px; }
  .live-col{ display:flex; flex-direction:column; align-items:flex-start; gap:14px; flex:0 0 auto; min-width:0; }
  .live-filtro-input{ width:100%; margin-bottom:0; }
  .live-card{ flex:0 0 auto; width:auto; min-width:270px; max-width:480px; box-sizing:border-box; }
  .live-card{ background:#FFFDFE; border:1.5px dashed rgba(157,88,124,0.45); border-radius:12px; padding:10px 10px 12px 12px; transition:background .2s, border-color .2s; }
  .live-card .cliente-chip{ font-size:0.85rem; padding:5px 10px; font-weight:700; flex:1 1 auto; min-width:0; overflow:hidden; }
  .live-card .cliente-chip .chip-name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  .live-card .cliente-chip .zona{ font-size:0.7rem; flex:0 0 auto; }
  .live-total-wrap{ display:flex; align-items:center; gap:6px; flex:0 0 auto; white-space:nowrap; }
  .live-card .live-total{ font-family:'Space Mono',monospace; font-weight:700; font-size:0.92rem; }
  .live-card-complete{ background:#F2FAFC; border:1.5px solid #8FCEDF; }
  .live-card-complete .cliente-chip{ background:#DFF3F8; }
  .live-badge-completa{
    font-size:0.68rem; font-weight:700; color:#146C82; background:#DFF3F8;
    width:18px; height:18px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center;
  }
  .row-bag-toggle{
    width:18px; height:18px; border:1.5px solid var(--line); border-radius:5px;
    background:#FFFFFF; color:transparent; font-size:0.68rem; line-height:1;
    display:inline-flex; align-items:center; justify-content:center; cursor:pointer; padding:0; flex:0 0 auto;
  }
  .row-bag-toggle:hover{ border-color:#4AA9C2; }
  .row-bag-toggle.on{ background:#4AA9C2; border-color:#4AA9C2; color:#fff; }
  .mini-rows{ margin-top:6px; }
  .mini-row{
    display:flex; align-items:center; gap:5px; padding:4px 1px;
    border-bottom:1px dashed rgba(157,88,124,0.3);
  }
  .mini-row:last-child{ border-bottom:none; }
  .mini-row.row-bagged{ background:linear-gradient(90deg, rgba(143,206,223,0.16), rgba(255,255,255,0)); }

  /* v2: temas, ajustes, ayuda, analitica y boletas */

  body[data-theme="deep-sky"]{--paper:#DFF4FF;--card:#FFFFFF;--ink:#123452;--ink-soft:#5D7890;--brick:#1677A7;--brick-dark:#0F5378;--mustard:#73C8F5;--sage:#2C88B8;--line:#B7DFF2;--shadow:0 2px 4px rgba(18,52,82,.08),0 14px 30px -16px rgba(23,119,167,.32)}
  body[data-theme="base-clean"]{--paper:#F5F7FA;--card:#FFFFFF;--ink:#243244;--ink-soft:#6B7788;--brick:#6D5DD3;--brick-dark:#5142B5;--mustard:#D8D1FF;--sage:#29A37A;--line:#E1E6ED;--shadow:0 2px 4px rgba(36,50,68,.06),0 14px 30px -18px rgba(36,50,68,.28)}
  .utility-fab{position:fixed;right:18px;bottom:18px;z-index:90;display:flex;gap:8px;flex-direction:column}.utility-fab .btn{box-shadow:var(--shadow);background:var(--card)}
  .settings-panel{width:min(720px,calc(100vw - 28px));background:var(--card);color:var(--ink);border-radius:18px;padding:20px;box-shadow:var(--shadow)}
  .settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.setting-group{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--paper)}
  .setting-group h3{margin:0 0 5px;font-family:'Fraunces',serif}.setting-group p{margin:0 0 10px;color:var(--ink-soft);font-size:.82rem}.setting-icon{font-size:1.35rem}.theme-grid,.receipt-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.choice-card{border:1.5px solid var(--line);border-radius:12px;padding:10px;background:var(--card);cursor:pointer;color:var(--ink);text-align:left}.choice-card.active{outline:3px solid color-mix(in srgb,var(--brick) 30%,transparent);border-color:var(--brick)}
  .help-tip{position:fixed;z-index:401;width:min(330px,calc(100vw - 28px));background:var(--card);color:var(--ink);border:2px solid var(--brick);border-radius:16px;padding:16px;box-shadow:0 20px 60px rgba(0,0,0,.35)}.help-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:399}.help-highlight{position:relative!important;z-index:400!important;outline:4px solid var(--mustard)!important;box-shadow:0 0 0 8px rgba(255,255,255,.25)!important}.help-actions{display:flex;justify-content:space-between;gap:8px;margin-top:12px}.help-progress{font-size:.75rem;color:var(--ink-soft)}
  .hist-filters{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px;max-width:760px}.analytics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:12px 0}.kpi{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px}.kpi b{display:block;font-size:1.35rem;margin-top:5px}.chart-wrap{height:260px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--card)}#salesChart,#hourChart{width:100%;height:100%;display:block}
  .brand-choice-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.brand-pill{border:1.5px solid var(--line);border-radius:999px;padding:8px 12px;background:var(--card);color:var(--ink);cursor:pointer}.brand-pill.on{background:var(--brick);color:white;border-color:var(--brick)}
  @media(max-width:640px){header.top{flex-wrap:wrap}.hist-filters{grid-template-columns:1fr}.utility-fab{right:10px;bottom:10px}.settings-panel{padding:14px}.chart-wrap{height:220px}}


  /* v3: menu de opciones, boleta original + disenos */
  header.top{flex-wrap:nowrap;}
  .menu-trigger{white-space:nowrap;}
  .opts-panel{width:min(860px,calc(100vw - 20px));background:var(--card);color:var(--ink);border-radius:18px;padding:18px;box-shadow:var(--shadow);align-self:flex-start;}

  .opt-item:last-child{margin-bottom:0;}
  .opt-action{flex:1;display:flex;align-items:center;gap:10px;text-align:left;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:700 .9rem 'Public Sans',sans-serif;cursor:pointer;}

  .opt-info{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--ink-soft);font-weight:800;cursor:pointer;}

  .opt-desc{display:none;position:absolute;z-index:5;right:0;top:calc(100% + 6px);width:min(280px,80vw);background:var(--ink);color:var(--card);font-size:.8rem;line-height:1.35;padding:10px 12px;border-radius:10px;box-shadow:var(--shadow);}

  @media (hover:none){ .opt-item:hover .opt-desc{display:none;} .opt-item.show-desc .opt-desc{display:block;} }
  .boleta{--ink:#5B2A4D;--ink-soft:#9C6E93;--line:#F3CFE3;--mustard:#F7AFCE;--brick:#C15B95;--brick-dark:#9E3F78;background:#FFFDFE;color:#5B2A4D;}

  .boleta.rc-mint{--rc-accent:#5DB98E;border:2px solid #A8E2C7;border-radius:22px;background:#FBFFFD repeating-linear-gradient(0deg,transparent 0 23px,#EAF8F1 23px 24px);}

  .boleta.rc-mint h3{color:#2F7A57;} .boleta.rc-mint .boleta-logo{border-color:#8FD6B5;}

  .boleta.rc-peach{--rc-accent:#EE9A7C;border:none;border-radius:6px;box-shadow:inset 0 0 0 2px #F6C3AF,inset 0 0 0 7px #FFFDFB,inset 0 0 0 8px #F6C3AF,0 20px 40px -12px rgba(0,0,0,.4);background:#FFFDFB;padding:30px 26px 24px;}

  .reg-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;}

  /* v5: botones renovados, iconos, tooltips y recorrido de ayuda */
  .head-actions{display:flex;gap:8px;align-items:center;flex:0 0 auto;}
  .btn{transition:transform .12s ease, box-shadow .18s ease, background-color .18s ease, border-color .18s ease, color .18s ease;line-height:1.1;justify-content:center;white-space:nowrap;}
  .btn:hover:not([disabled]){transform:translateY(-1px);box-shadow:0 6px 14px -8px color-mix(in srgb,var(--brick) 70%,transparent);}
  .btn:active:not([disabled]){transform:translateY(0) scale(.98);box-shadow:none;}
  .btn:focus-visible,.btn-shine:focus-visible,nav.tabs button:focus-visible,.modo-buscar:focus-visible{outline:3px solid color-mix(in srgb,var(--brick) 35%,transparent);outline-offset:2px;}
  .btn-ghost{background:var(--card);}

  .tk-tip{position:fixed;z-index:500;max-width:260px;background:var(--ink);color:var(--card);font:500 .78rem/1.35 'Public Sans',sans-serif;padding:8px 11px;border-radius:9px;box-shadow:0 10px 26px -10px rgba(0,0,0,.45);pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .14s ease, transform .14s ease;}

(function(){

  /* ---------- almacenamiento persistente ---------- */
  // Si la app corre dentro de Claude, usamos window.storage (se guarda en tu cuenta).
  // Si se abrio como archivo local (doble clic / descargado), no existe window.storage,
  // asi que usamos localStorage del navegador como respaldo automatico.
  var STORAGE_PREFIX = "tienda_boletas_";
  var hasCloudStorage = (typeof window.storage === "object" && window.storage && typeof window.storage.get === "function");

  function loadKey(key, fallback){
    if(hasCloudStorage){
      return window.storage.get(key, false).then(function(res){
        if(res && res.value){
          try { return JSON.parse(res.value); } catch(e){ return fallback; }
        }
        return fallback;
      }).catch(function(){ return loadKeyLocal(key, fallback); });
    }
    return loadKeyLocal(key, fallback);
  }
  function loadKeyLocal(key, fallback){
    try{
      var raw = window.localStorage.getItem(STORAGE_PREFIX + key);
      if(raw) return Promise.resolve(JSON.parse(raw));
    } catch(e){}
    return Promise.resolve(fallback);
  }
  function saveKey(key, value){
    if(hasCloudStorage){
      return window.storage.set(key, JSON.stringify(value), false).catch(function(err){
        console.error("storage error", key, err);
        saveKeyLocal(key, value);
      });
    }
    return saveKeyLocal(key, value);
  }
  function saveKeyLocal(key, value){
    try{
      window.localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(value));
    } catch(e){
      console.error("local storage error", key, e);
      showToast("No se pudo guardar (" + key + ")");
    }
  }
  function persist(part){
    if(part === "config") saveKey("config", state.config);
    if(part === "productos") saveKey("productos", state.productos);
    if(part === "clientes") saveKey("clientes", state.clientes);
    if(part === "zonas") saveKey("zonas", state.zonas);
    if(part === "ventas") saveKey("ventas", state.ventas);
    if(part === "carrito") saveKey("carrito", state.carrito);
    if(part === "live") saveKey("live", state.live);
    if(part === "liveDescuentos") saveKey("liveDescuentos", state.liveDescuentos);
    if(part === "compartidos") saveKey("compartidos", state.compartidos);
    if(part === "anotaciones") saveKey("anotaciones", state.anotaciones);
  }

  function loadAll(){
    return Promise.all([
      loadKey("config", { tienda: "Tienditas Kiara", theme:"default", receiptStyle:"classic", brands:[{id:"brand1",nombre:"Marca 1",imageDataUri:""},{id:"brand2",nombre:"Marca 2",imageDataUri:""}] }),

      if(!state.config.receiptStyle || state.config.receiptStyle.indexOf("receipt-")===0) state.config.receiptStyle="classic";
      if(!state.config.brands || state.config.brands.length<2) state.config.brands=[{id:"brand1",nombre:"Marca 1",imageDataUri:""},{id:"brand2",nombre:"Marca 2",imageDataUri:""}];
      state.productos = r[1];
      state.clientes = r[2];

      state.carrito = r[5] || { clienteId: null, items: [] };
      state.compartidos = r[6] || [];
      state.live = r[7] || [];
      state.liveDescuentos = r[8] || {};

  /* ---------- helpers ---------- */
  function money(n){
    n = Math.round(Number(n)||0);
    return "$" + n.toLocaleString("es-CL");
  }
  var ultimoLiveGridInfo = null;
  function estimarAnchoTarjeta(rows){
    var maxCant = 1, maxProd = 1, maxPrecio = 1, maxTotal = 1;
    rows.forEach(function(r){
      maxCant = Math.max(maxCant, String(r.cantidad).length);
      maxProd = Math.max(maxProd, String(r.producto).length);
      maxPrecio = Math.max(maxPrecio, String(r.precio).length);
      maxTotal = Math.max(maxTotal, money(r.precio * r.cantidad).length);
    });
    var cantCh = Math.max(2, maxCant + 1.3);
    var prodCh = Math.min(26, Math.max(8, maxProd + 1.3));
    var precioCh = Math.max(3, maxPrecio + 1.3);
    var totalCh = Math.max(3, maxTotal + 0.3);

    var medidor = document.getElementById("medidor");
    if(medidor){
      medidor.innerHTML =
        '<button class="row-bag-toggle"></button>' +
        '<input type="number" class="mini-cant" readonly value="'+("9".repeat(Math.ceil(cantCh-1.3)) || "9")+'" style="width:'+cantCh+'ch;">' +
        '<input type="text" class="mini-prod" readonly value="" style="width:'+prodCh+'ch;">' +
        '<input type="number" class="mini-price" readonly value="" style="width:'+precioCh+'ch;">' +
        '<span class="mini-total" style="min-width:'+totalCh+'ch;">'+("9".repeat(Math.ceil(totalCh)))+'</span>' +
        '<button class="btn-danger">&times;</button>';
      var anchoReal = medidor.getBoundingClientRect().width + 24 /* padding tarjeta */;
      medidor.innerHTML = "";
      if(anchoReal > 0){
        return Math.max(270, Math.min(480, anchoReal));
      }
    }
    // respaldo si el medidor no esta disponible
    var CH_PX = 7.4;
    var fijos = 18 + 24 + 26 + 24;
    var ancho = fijos + (cantCh + prodCh + precioCh + totalCh) * CH_PX;
    return Math.max(270, Math.min(480, ancho));
  }
  function generarOrdenes(tarjetas){
    var porAnchoDesc = tarjetas.slice().sort(function(a,b){ return b.anchoEst - a.anchoEst; });
    var porAnchoDescAlturaAsc = tarjetas.slice().sort(function(a,b){
      if(b.anchoEst !== a.anchoEst) return b.anchoEst - a.anchoEst;
      return a.puntaje - b.puntaje;
    });
    var porAlturaDescAnchoDesc = tarjetas.slice().sort(function(a,b){
      if(b.puntaje !== a.puntaje) return b.puntaje - a.puntaje;
      return b.anchoEst - a.anchoEst;
    });
    return [porAnchoDesc, porAnchoDescAlturaAsc, porAlturaDescAnchoDesc];
  }
  function elegirColumnaDestino(alturas, anchosMax, anchoCard){
    var mejorIdx = 0;
    var mejorCosto = Infinity;
    var mejorAltura = Infinity;
    for(var i = 0; i < alturas.length; i++){
      var costo = Math.max(0, anchoCard - anchosMax[i]);
      if(costo < mejorCosto - 0.5 || (Math.abs(costo - mejorCosto) <= 0.5 && alturas[i] < mejorAltura)){
        mejorCosto = costo;
        mejorAltura = alturas[i];
        mejorIdx = i;
      }
    }
    return mejorIdx;
  }
  function asignarColumnas(tarjetas, ordenLlenado, n){
    var alturas = new Array(n).fill(0);
    var anchosMax = new Array(n).fill(0);
    var asignaciones = [];

    // fase 1: sembrar cada columna con una tarjeta distinta (las N mas anchas), asi ninguna columna queda vacia
    var porAnchoDesc = tarjetas.slice().sort(function(a,b){ return b.anchoEst - a.anchoEst; });
    var semillas = porAnchoDesc.slice(0, n);
    semillas.forEach(function(t, i){
      alturas[i] += t.puntaje;
      anchosMax[i] = t.anchoEst;
      asignaciones.push({ t: t, idx: i });
    });

    // fase 2: repartir el resto minimizando cuanto ancho le agregan a la columna
    ordenLlenado.forEach(function(t){
      if(semillas.indexOf(t) !== -1) return;
      var idx = elegirColumnaDestino(alturas, anchosMax, t.anchoEst);
      alturas[idx] += t.puntaje;
      if(t.anchoEst > anchosMax[idx]) anchosMax[idx] = t.anchoEst;
      asignaciones.push({ t: t, idx: idx });
    });

    var anchoTotal = anchosMax.reduce(function(a,b){ return a+b; }, 0) + (n-1)*14;
    return { asignaciones: asignaciones, anchoTotal: anchoTotal };
  }
  function mejorOrdenParaN(tarjetas, n){
    var ordenes = generarOrdenes(tarjetas);
    var mejor = null;
    ordenes.forEach(function(orden){
      var resultado = asignarColumnas(tarjetas, orden, n);
      if(!mejor || resultado.anchoTotal < mejor.anchoTotal) mejor = resultado;
    });
    return mejor;
  }
  function elegirNumColumnas(tarjetas, anchoDisponible){
    var maxPosibles = Math.min(tarjetas.length, 8);
    for(var n = maxPosibles; n >= 1; n--){
      var resultado = mejorOrdenParaN(tarjetas, n);
      if(resultado.anchoTotal <= anchoDisponible + 16) return n;
    }
    return 1;
  }
  function empaquetarEnColumnas(grid, tarjetas, forzarNumCols){
    if(tarjetas.length === 0) return 0;
    var refEl = document.getElementById("view");
    var anchoDisponible = ((refEl && refEl.clientWidth) || window.innerWidth || 900) - 44 /* padding+borde de .card */;
    var numCols = forzarNumCols || elegirNumColumnas(tarjetas, anchoDisponible);
    numCols = Math.min(numCols, tarjetas.length);
    grid.innerHTML = "";
    var columnas = [];
    for(var i = 0; i < numCols; i++){
      var col = document.createElement("div");
      col.className = "live-col";
      grid.appendChild(col);
      columnas.push(col);
    }
    var resultado = mejorOrdenParaN(tarjetas, numCols);
    resultado.asignaciones.forEach(function(a){
      columnas[a.idx].appendChild(a.t.card);
    });
    return numCols;
  }
  function ajustarEmpaquetadoSiDesborda(){
    if(!ultimoLiveGridInfo) return;
    var info = ultimoLiveGridInfo;

    // baja columnas si algo se desborda de verdad (medido en el navegador)
    var intentos = 0;
    while(info.numCols > 1 && info.grid.scrollWidth > info.grid.clientWidth + 16 && intentos < 10){
      info.numCols = empaquetarEnColumnas(info.grid, info.tarjetas, info.numCols - 1);
      intentos++;
    }

    // intenta subir columnas de a una, midiendo de verdad en el navegador si entra
    intentos = 0;
    while(info.numCols < info.tarjetas.length && intentos < 10){
      var numColsAnterior = info.numCols;
      var numColsProbado = empaquetarEnColumnas(info.grid, info.tarjetas, numColsAnterior + 1);
      if(info.grid.scrollWidth <= info.grid.clientWidth + 16){
        info.numCols = numColsProbado;
      } else {
        empaquetarEnColumnas(info.grid, info.tarjetas, numColsAnterior);
        info.numCols = numColsAnterior;
        break;
      }
      intentos++;
    }
  }
  function alinearColumnasTarjeta(container){
    var cantEls = container.querySelectorAll(".mini-cant");
    var prodEls = container.querySelectorAll(".mini-prod");
    var precioEls = container.querySelectorAll(".mini-price");
    var totalEls = container.querySelectorAll(".mini-total");
    var maxCant = 0, maxProd = 0, maxPrecio = 0, maxTotal = 0;
    cantEls.forEach(function(el){ maxCant = Math.max(maxCant, String(el.value).length); });
    prodEls.forEach(function(el){ maxProd = Math.max(maxProd, String(el.value).length); });
    precioEls.forEach(function(el){ maxPrecio = Math.max(maxPrecio, String(el.value).length); });
    totalEls.forEach(function(el){ maxTotal = Math.max(maxTotal, el.textContent.length); });
    var cantCh = Math.max(2, maxCant + 1.3);
    var prodCh = Math.min(26, Math.max(8, maxProd + 1.3));
    var precioCh = Math.max(3, maxPrecio + 1.3);
    var totalCh = Math.max(3, maxTotal + 0.3);
    cantEls.forEach(function(el){ el.style.width = cantCh + "ch"; });
    prodEls.forEach(function(el){ el.style.width = prodCh + "ch"; });
    precioEls.forEach(function(el){ el.style.width = precioCh + "ch"; });
    totalEls.forEach(function(el){ el.style.minWidth = totalCh + "ch"; });
  }
  function fechaLocalYYYYMMDD(d){
    var y = d.getFullYear();
    var m = String(d.getMonth()+1).padStart(2,"0");
    var day = String(d.getDate()).padStart(2,"0");
    return y + "-" + m + "-" + day;
  }
  function calcularDescuento(subtotal, descInfo){
    if(!descInfo || !descInfo.valor) return 0;
    var monto = descInfo.tipo === "porcentaje"
      ? Math.round(subtotal * (Number(descInfo.valor)||0) / 100)
      : Number(descInfo.valor)||0;
    if(monto < 0) monto = 0;
    if(monto > subtotal) monto = subtotal;
    return monto;
  }

  function render(){

  /* ---------- autocomplete generico ---------- */
  var openAuto = null;
  function closeAllAuto(){
    document.querySelectorAll(".autolist").forEach(function(n){ n.remove(); });
    openAuto = null;
  }
  document.addEventListener("click", function(e){
    if(!e.target.closest(".field")) closeAllAuto();
  });

  function attachAutocomplete(input, getOptions, onSelect, opts){
    opts = opts || {};
    var activeIndex = -1;
    input.addEventListener("input", function(){ activeIndex=-1; openDropdown(); });
    input.addEventListener("focus", function(){ activeIndex=-1; openDropdown(); });
    input.addEventListener("keydown", function(e){
      if(!openAuto) return;
      var options = Array.prototype.slice.call(openAuto.querySelectorAll(".opt"));
      if(!options.length) return;
      if(e.key === "ArrowDown"){ e.preventDefault(); activeIndex=(activeIndex+1)%options.length; }
      else if(e.key === "ArrowUp"){ e.preventDefault(); activeIndex=(activeIndex-1+options.length)%options.length; }
      else if(e.key === "Tab" || e.key === "Enter"){
        if(activeIndex<0) activeIndex=0;
        if(options[activeIndex]){ e.preventDefault(); options[activeIndex].dispatchEvent(new MouseEvent("mousedown",{bubbles:true})); }
        return;
      } else if(e.key === "Escape"){ closeAllAuto(); return; } else return;
      options.forEach(function(o,i){ o.classList.toggle("hi",i===activeIndex); });
      options[activeIndex].scrollIntoView({block:"nearest"});
    });
    function openDropdown(){
      closeAllAuto();
      var q = input.value.trim();
      var items = getOptions(q);
      var list = document.createElement("div");
      list.className = "autolist";
      if(items.length === 0){
        var emptyMsg = opts.emptyMsg ? opts.emptyMsg(q) : "Sin resultados";
        list.appendChild(el('<div class="empty">' + emptyMsg + '</div>'));
      } else {
        items.forEach(function(it){
          var row = document.createElement("div");

        cardActions.className = "live-card-actions";
        var btnMarcarTodo = el('<button class="btn btn-ghost btn-sm">'+(todosEmbolsados ? "Desmarcar todo" : "Marcar todo")+'</button>');
        btnMarcarTodo.onclick = function(){
          var nuevoEstado = !todosEmbolsados;
          g.rows.forEach(function(r){ r.embolsado = nuevoEstado; });
          persist("live");
          render();
        };
        cardActions.appendChild(btnMarcarTodo);
        var btnBoletaCliente = el('<button class="btn btn-primary btn-sm">Generar boleta</button>');
        btnBoletaCliente.onclick = function(){ openBoleta(cid, g.rows, descInfo); };
        cardActions.appendChild(btnBoletaCliente);
        card.appendChild(cardActions);

        // puntaje aproximado de alto: cabecera + una fila por producto + descuento + boton
        var puntaje = 46 + g.rows.length * 27 + 66;
        tarjetasParaEmpaquetar.push({ card: card, puntaje: puntaje, anchoEst: Math.min(500, estimarAnchoTarjeta(g.rows) + (hayMarcaEnCard ? 22 : 0)) });
      });
      var numColsUsadas = empaquetarEnColumnas(grid, tarjetasParaEmpaquetar);
      ultimoLiveGridInfo = { grid: grid, tarjetas: tarjetasParaEmpaquetar, numCols: numColsUsadas };
      cardList.appendChild(grid);

      var granBox = document.createElement("div");
      granBox.className = "totals-row total";
      granBox.style.marginTop = "14px";
      granBox.innerHTML = '<span>Total del live</span><span class="num">'+money(granTotal)+'</span>';
      cardList.appendChild(granBox);
      }
    }
    wrap.appendChild(cardList);
    wrap.appendChild(buildRegistroYMusica());

    var confirmingNuevo = false;
    btnNuevoLive.onclick = function(){
      if(state.live.length === 0){ showToast("La lista ya esta vacia"); return; }
      if(!confirmingNuevo){
        confirmingNuevo = true;
        btnNuevoLive.textContent = "¿Seguro? exporta antes si quieres";
        btnNuevoLive.classList.remove("btn-ghost");
        btnNuevoLive.classList.add("btn-primary");
        setTimeout(function(){
          confirmingNuevo = false;
          btnNuevoLive.textContent = "Nuevo live";
          btnNuevoLive.classList.add("btn-ghost");
          btnNuevoLive.classList.remove("btn-primary");
        }, 4000);
        return;
      }
      state.live = [];
      persist("live");
      showToast("Lista vaciada, listo para el nuevo live");
      render();
    };

    return wrap;
  }

  function volverVentaAlListado(v){
    var clienteId = v.clienteId;
    var cliente = clienteId ? findCliente(clienteId) : null;
    if(!cliente){
      cliente = state.clientes.find(function(c){ return c.nombre.toLowerCase() === v.clienteNombre.toLowerCase(); });
      if(!cliente){
        cliente = { id: uid(), nombre: v.clienteNombre, zonaId: state.zonas[0] && state.zonas[0].id, ubicacion: "" };
        state.clientes.push(cliente);
        persist("clientes");
      }
      clienteId = cliente.id;
    }
    v.items.forEach(function(it){
      state.live.push({
        id: uid(), clienteId: clienteId, clienteNombre: cliente.nombre,
        producto: it.nombre, cantidad: it.cantidad, precio: it.precio, embolsado: false, brandId: (it.brandId != null ? it.brandId : (v.brandId || ""))
      });
    });
    if(v.descuento > 0){
      state.liveDescuentos[clienteId] = { valor: v.descuento, tipo: "monto" };
      persist("liveDescuentos");
    }
    state.ventas = state.ventas.filter(function(x){ return x.id !== v.id; });
    persist("ventas");
    persist("live");
    showToast("Boleta devuelta a Ventas de este live");
    tab = "vender";
    render();
  }

  function agruparLivePorCliente(){
    var order = [];
    var groups = {};
    state.live.forEach(function(row){
      if(!groups[row.clienteId]){
        groups[row.clienteId] = { clienteId: row.clienteId, clienteNombre: row.clienteNombre, rows: [] };
        order.push(row.clienteId);
      }
      groups[row.clienteId].rows.push(row);
    });
    return order.map(function(cid){ return groups[cid]; });
  }

  function openBoleta(clienteId, itemsForClient, descInfo){
    var overlay = document.createElement("div");
    overlay.className = "overlay";
    document.body.appendChild(overlay);

    function pintar(cid, itemsRows, descInfoActual){
      var cliente = findCliente(cid);
      if(!cliente){ showToast("No se encontro la clienta"); overlay.remove(); return; }
      var zona = findZona(cliente.zonaId);
      var items = itemsRows.map(function(r){ return { nombre:r.producto, cantidad:r.cantidad, precio:r.precio, brandId:r.brandId||"" }; });
      var subtotal = items.reduce(function(a,it){ return a + it.precio*it.cantidad; }, 0);
      var descuentoVal = calcularDescuento(subtotal, descInfoActual);
      var delivery = zona ? zona.precio : 0;
      var total = subtotal - descuentoVal + delivery;
      var fecha = new Date();
      var descuentoLabel = descInfoActual && descInfoActual.tipo === "porcentaje"
        ? "Descuento (" + descInfoActual.valor + "%)"
        : "Descuento";

      var queue = agruparLivePorCliente();
      var idx = queue.findIndex(function(g){ return g.clienteId === cid; });
      var hayAnterior = idx > 0;
      var haySiguiente = idx >= 0 && idx < queue.length - 1;

      var rowsHtml = items.map(function(it, i){
        return '<tr data-idx="'+i+'">' +
          '<td contenteditable="true" class="ed-cant">'+it.cantidad+'</td>' +
          detalleBoleta(it,true) +
          '<td class="num" contenteditable="true" data-raw="'+it.precio+'">'+money(it.precio)+'</td>' +
          '<td class="num rowtotal">'+money(it.precio*it.cantidad)+'</td></tr>';
      }).join("");

      overlay.innerHTML =
        '<div class="boleta-wrap">' +
          '<div class="boleta '+receiptClass({rows:itemsRows})+(items.length > 8 ? ' compacta' : '')+'" id="boletaCard">' + sharedBanner({rows:itemsRows}) +
            '<img class="boleta-logo" src="'+getLogoSrc()+'" alt="" onerror="this.style.display=\'none\'">' +
            '<h3>'+escapeHtml(state.config.tienda)+'</h3>' +
            '<div class="sub">Boleta de venta</div>' +
            '<div class="meta"><span>Clienta</span><span>'+escapeHtml(cliente.nombre)+'</span></div>' +
            (cliente.ubicacion ? '<div class="meta"><span>Ubicacion</span><span>'+escapeHtml(cliente.ubicacion)+'</span></div>' : '') +
            '<div class="meta"><span>Fecha</span><span>'+fecha.toLocaleDateString("es-CL")+' '+fecha.toLocaleTimeString("es-CL",{hour:"2-digit",minute:"2-digit"})+'</span></div>' +
            '<hr>' +
            '<table><thead><tr><th>Cant</th><th>Detalle</th><th class="num">Precio</th><th class="num">Total</th></tr></thead><tbody>'+rowsHtml+'</tbody></table>' +
            '<hr>' +
            '<div class="totals-row"><span>Subtotal</span><span class="num" id="boletaSubtotalVal">'+money(subtotal)+'</span></div>' +
            (descuentoVal>0 ? '<div class="totals-row descuento"><span>'+descuentoLabel+'</span><span class="num">-'+money(descuentoVal)+'</span></div>' : '') +
            '<div class="totals-row"><span>Delivery ('+(zona?escapeHtml(zona.nombre):"-")+')</span><span class="num">'+money(delivery)+'</span></div>' +
            '<div class="totals-row total"><span>Total</span><span class="num" id="boletaTotalVal">'+money(total)+'</span></div>' +
            '<div class="thanks">Gracias por tu compra ✿</div>' +
            '<img class="boleta-mascota" src="'+getMascota2Src()+'" alt="" onerror="this.style.display=\'none\'">' +
          '</div>' +
        '</div>' +
        '<div class="overlay-actions">' +
          (queue.length>1 ? '<div class="overlay-nav"><button class="btn btn-ghost btn-sm" id="btnPrevBoleta"'+(hayAnterior?'':' disabled')+'>&larr; Anterior</button><span class="overlay-nav-pos">'+(idx+1)+' / '+queue.length+'</span><button class="btn btn-ghost btn-sm" id="btnNextBoleta"'+(haySiguiente?'':' disabled')+'>Siguiente &rarr;</button></div>' : '') +
          '<button class="btn btn-ghost" id="btnCerrar">Cerrar</button>' +
          '<button class="btn btn-ghost" id="btnImprimir">Imprimir</button>' +
          '<button class="btn btn-ghost" id="btnCopiarImg">Copiar imagen</button>' +
          '<button class="btn btn-primary" id="btnGuardar">Guardar en historial</button>' +
        '</div>';

      // recalcula totales si se edita cantidad/precio en la boleta (solo afecta esta vista)
      var tbody = overlay.querySelector("#boletaCard tbody");
      function recalcularBoleta(){
        var nuevoSubtotal = 0;
        tbody.querySelectorAll("tr").forEach(function(tr){
          var cant = parseFloat(tr.querySelector(".ed-cant").textContent.replace(/[^0-9.]/g,"")) || 0;
          var precio = parseInt(tr.querySelector("[data-raw]").textContent.replace(/[^0-9]/g,"")) || 0;
          var totalItem = cant * precio;
          tr.querySelector(".rowtotal").textContent = money(totalItem);
          nuevoSubtotal += totalItem;
        });
        var nuevoDescuento = calcularDescuento(nuevoSubtotal, descInfoActual);
        var nuevoTotal = nuevoSubtotal - nuevoDescuento + delivery;
        var subEl = overlay.querySelector("#boletaSubtotalVal");
        var totEl = overlay.querySelector("#boletaTotalVal");
        if(subEl) subEl.textContent = money(nuevoSubtotal);
        if(totEl) totEl.textContent = money(nuevoTotal);
      }
      tbody.querySelectorAll("[contenteditable]").forEach(function(cell){
        cell.addEventListener("blur", recalcularBoleta);
      });

      overlay.querySelector("#btnCerrar").onclick = function(){ overlay.remove(); };
      overlay.querySelector("#btnImprimir").onclick = function(){ window.print(); };
      overlay.querySelector("#btnCopiarImg").onclick = function(){ copiarBoletaComoImagen(); };
      var btnPrev = overlay.querySelector("#btnPrevBoleta");
      var btnNext = overlay.querySelector("#btnNextBoleta");
      if(btnPrev) btnPrev.onclick = function(){
        if(idx > 0){
          var prevG = queue[idx-1];
          pintar(prevG.clienteId, prevG.rows, state.liveDescuentos[prevG.clienteId] || null);
        }
      };
      if(btnNext) btnNext.onclick = function(){
        if(idx < queue.length-1){
          var nextG = queue[idx+1];
          pintar(nextG.clienteId, nextG.rows, state.liveDescuentos[nextG.clienteId] || null);
        }
      };
      overlay.querySelector("#btnGuardar").onclick = function(){
        var venta = {
          id: uid(),
          fecha: fecha.toISOString(),
          clienteId: cliente.id,
          clienteNombre: cliente.nombre,
          zonaNombre: zona ? zona.nombre : "-",
          zonaPrecio: delivery,
          items: items,
          subtotal: subtotal,
          descuento: descuentoVal,
          total: total,
          brandId: (itemsRows.find(function(r){return r.brandId;})||{}).brandId || ""
        };
        state.ventas.unshift(venta);
        persist("ventas");
        // saca de la lista del live solo las filas que se acaban de facturar
        var idsFacturados = itemsRows.map(function(r){ return r.id; });
        state.live = state.live.filter(function(r){ return idsFacturados.indexOf(r.id) === -1; });
        persist("live");
        if(state.liveDescuentos && state.liveDescuentos[cid] != null){
          delete state.liveDescuentos[cid];
          persist("liveDescuentos");
        }
        showToast("Boleta guardada en el historial");
        // pasa a la siguiente boleta pendiente si existe, si no cierra
        var quedan = agruparLivePorCliente();
        if(quedan.length > 0){
          var siguienteIdx = Math.min(idx, quedan.length - 1);
          var sig = quedan[siguienteIdx];
          pintar(sig.clienteId, sig.rows, state.liveDescuentos[sig.clienteId] || null);
        } else {
          overlay.remove();
        }
        render();
      };
    }

    pintar(clienteId, itemsForClient, descInfo || null);
    overlay.onclick = function(e){ if(e.target === overlay) overlay.remove(); };
  }

  function copiarBoletaComoImagen(){
    var el = document.getElementById("boletaCard");
    if(!el || typeof html2canvas === "undefined"){ showToast("No se pudo generar la imagen"); return; }
    showToast("Generando imagen...");
    intentarCapturarBoleta(el, true);
  }

  function intentarCapturarBoleta(el, primerIntento){
    html2canvas(el, { backgroundColor: "#FFFDFE", scale: 2, useCORS: true }).then(function(canvas){
      canvas.toBlob(function(blob){
        if(!blob){
          if(primerIntento){ reintentarCapturaSinImagenes(el); return; }
          showToast("No se pudo generar la imagen");
          return;
        }
        copiarBlobBoleta(blob, false);
      });
    }).catch(function(){
      if(primerIntento){ reintentarCapturaSinImagenes(el); }
      else { showToast("No se pudo generar la imagen"); }
    });
  }

  // algunos navegadores bloquean el canvas si hay imagenes locales (logo, mascota)
  // cuando el archivo se abre directo con file://; en ese caso reintenta ocultandolas
  function reintentarCapturaSinImagenes(el){
    var imgs = el.querySelectorAll("img");
    var previos = [];
    imgs.forEach(function(img){ previos.push(img.style.display); img.style.display = "none"; });
    html2canvas(el, { backgroundColor: "#FFFDFE", scale: 2 }).then(function(canvas){
      imgs.forEach(function(img, i){ img.style.display = previos[i]; });
      canvas.toBlob(function(blob){
        if(!blob){ showToast("No se pudo generar la imagen"); return; }
        copiarBlobBoleta(blob, true);
      });
    }).catch(function(){
      imgs.forEach(function(img, i){ img.style.display = previos[i]; });
      showToast("No se pudo generar la imagen");
    });
  }

        '<hr>' +
        '<table><thead><tr><th>Cant</th><th>Detalle</th><th class="num">Precio</th><th class="num">Total</th></tr></thead><tbody>'+rowsHtml+'</tbody></table>' +

  function intentarCapturarLote(host){
    html2canvas(host, { backgroundColor: "#FFFDFE", scale: 2, useCORS: true }).then(function(canvas){
      canvas.toBlob(function(blob){
        host.innerHTML = "";
        if(!blob){ showToast("No se pudo generar la imagen"); return; }
        copiarBlobBoleta(blob, false);
      });
    }).catch(function(){
      var imgs = host.querySelectorAll("img");
      var previos = [];
      imgs.forEach(function(img){ previos.push(img.style.display); img.style.display = "none"; });
      html2canvas(host, { backgroundColor: "#FFFDFE", scale: 2 }).then(function(canvas){
        host.innerHTML = "";
        canvas.toBlob(function(blob){
          if(!blob){ showToast("No se pudo generar la imagen"); return; }
          copiarBlobBoleta(blob, true);
        });
      }).catch(function(){
        host.innerHTML = "";
        showToast("No se pudo generar la imagen");
      });
    });
  }

  function copiarBlobBoleta(blob, sinImagenes){
    if(navigator.clipboard && window.ClipboardItem){
      navigator.clipboard.write([ new ClipboardItem({ "image/png": blob }) ]).then(function(){
        showToast(sinImagenes ? "Boleta copiada sin el logo (tu navegador bloquea imagenes locales)" : "Boleta copiada, pegala donde quieras");
      }).catch(function(){ descargarImagenBoleta(blob); });
    } else {
      descargarImagenBoleta(blob);
    }
  }

  function descargarImagenBoleta(blob){
    var url = URL.createObjectURL(blob);

      card.appendChild(searchField);
      var listBox = document.createElement("div");
      card.appendChild(listBox);

      function draw(filter){
        listBox.innerHTML = "";
        var f = (filter||"").toLowerCase();
        var desde = histDesdeFiltro ? new Date(histDesdeFiltro+"T00:00:00") : null;
        var hasta = histHastaFiltro ? new Date(histHastaFiltro+"T23:59:59") : null;
        var filtered = state.ventas.filter(function(v){ var d=new Date(v.fecha); return v.clienteNombre.toLowerCase().indexOf(f)!==-1 && (!desde||d>=desde) && (!hasta||d<=hasta); });
        if(filtered.length === 0){
          listBox.appendChild(el('<div class="empty-state">Sin resultados.</div>'));
        }
        filtered.forEach(function(v){
          var d = new Date(v.fecha);
          var item = document.createElement("div");
          item.className = "hist-item";
          item.innerHTML =
            '<div class="hist-head">' +
              '<div><div class="who">'+escapeHtml(v.clienteNombre)+'</div><div class="when">'+d.toLocaleDateString("es-CL")+' '+d.toLocaleTimeString("es-CL",{hour:"2-digit",minute:"2-digit"})+'</div></div>' +
              '<div class="amt num">'+money(v.total)+'</div>' +
            '</div>' +
            '<div class="hist-body"></div>';
          var body = item.querySelector(".hist-body");
          var rows = v.items.map(function(it){ return '<tr><td>'+it.cantidad+'x</td>'+detalleBoleta(it,false)+'<td style="text-align:right" class="num">'+money(it.precio*it.cantidad)+'</td></tr>'; }).join("");
          body.innerHTML =
            '<table>'+rows+
            (v.descuento>0 ? '<tr><td></td><td style="color:var(--brick-dark)">Descuento</td><td style="text-align:right" class="num">-'+money(v.descuento)+'</td></tr>' : '') +
            '<tr><td></td><td style="color:var(--ink-soft)">Delivery ('+escapeHtml(v.zonaNombre)+')</td><td style="text-align:right" class="num">'+money(v.zonaPrecio)+'</td></tr>' +
            '<tr><td></td><td><b>Total</b></td><td style="text-align:right" class="num"><b>'+money(v.total)+'</b></td></tr>' +
            '</table>' +
            '<div class="hist-actions">' +
              '<button class="btn btn-ghost btn-sm" id="verBoleta">Generar boleta</button>' +
              '<button class="btn btn-ghost btn-sm" id="volverListado">Volver al listado</button>' +
              '<button class="btn-danger" id="del">Eliminar</button>' +
            '</div>';
          body.querySelector("#verBoleta").onclick = function(e){
            e.stopPropagation();
            verBoletaGuardada(v);
          };
          body.querySelector("#volverListado").onclick = function(e){
            e.stopPropagation();
            volverVentaAlListado(v);
          };
          body.querySelector("#del").onclick = function(e){
            e.stopPropagation();
            state.ventas = state.ventas.filter(function(x){ return x.id !== v.id; });
            persist("ventas");
            render();
          };
          item.querySelector(".hist-head").onclick = function(){ body.classList.toggle("open"); };
          listBox.appendChild(item);
        });
      }
      searchField.querySelector("#histSearch").value=histNombreFiltro; searchField.querySelector("#histDesde").value=histDesdeFiltro; searchField.querySelector("#histHasta").value=histHastaFiltro;
      draw(histNombreFiltro);
      searchField.querySelector("#histSearch").addEventListener("input", function(e){ histNombreFiltro=e.target.value; draw(histNombreFiltro); });
      searchField.querySelector("#histDesde").addEventListener("change", function(e){ histDesdeFiltro=e.target.value; draw(histNombreFiltro); });
      searchField.querySelector("#histHasta").addEventListener("change", function(e){ histHastaFiltro=e.target.value; draw(histNombreFiltro); });

      var totalGeneral = state.ventas.reduce(function(a,v){ return a+v.total; }, 0);
      card.appendChild(el('<div class="totals-row total" style="margin-top:14px;"><span>Total historico</span><span class="num">'+money(totalGeneral)+'</span></div>'));
    }

  var PINK_HEADER = "FFF7AFCE";

  function styleHeaderRow(row){
    row.eachCell(function(cell){
      cell.fill = { type:"pattern", pattern:"solid", fgColor:{argb:PINK_HEADER} };
      cell.font = { bold:true, color:{argb:INK_HEX} };
      cell.alignment = { vertical:"middle" };
      cell.border = { bottom:{style:"thin", color:{argb:PINK_HEADER}} };
    });
  }
  function styleBodyRow(row, i){
    if(i % 2 === 0){
      row.eachCell(function(cell){
        cell.fill = { type:"pattern", pattern:"solid", fgColor:{argb:PINK_SOFT} };
      });
    }
  }

  }

  function sheetToRows(ws){
    var headers = [];
    var rows = [];
    ws.eachRow(function(row, rowNumber){
      var vals = row.values; // 1-indexed, vals[0] is empty
      if(rowNumber === 1){
        for(var i=1;i<vals.length;i++){ headers.push(String(vals[i]||"").trim()); }
      } else {
        var obj = {};
        for(var j=1;j<vals.length;j++){ obj[headers[j-1]] = vals[j]; }
        rows.push(obj);
      }
    });
    return rows;
  }

  function importExcelFile(file){
    var reader = new FileReader();
    reader.onload = function(e){
      var wb = new ExcelJS.Workbook();
      wb.xlsx.load(e.target.result).then(function(){
        var summary = { clientes:0, productos:0, zonas:0, ventas:0, live:0 };
        var wsClientas = wb.getWorksheet("Clientas");
        var wsProductos = wb.getWorksheet("Productos");
        var wsZonas = wb.getWorksheet("Zonas");
        var wsVentas = wb.getWorksheet("Ventas");
        var wsLive = wb.getWorksheet("Live_actual");
        var wsTablaVentas = wb.getWorksheet("Tabla_de_Ventas");
        var wsBoleta = wb.getWorksheet("Boleta");

        function ensureZona(nombre, precio){
          nombre = String(nombre||"").trim();
          if(!nombre) return null;
          var existing = state.zonas.find(function(z){ return z.nombre.toLowerCase() === nombre.toLowerCase(); });
          if(existing) return existing;
          var z = { id: uid(), nombre: nombre, precio: Number(precio)||0 };
          state.zonas.push(z); summary.zonas++;
          return z;
        }
        function ensureCliente(nombre, zonaId, ubicacion){
          nombre = String(nombre||"").trim();
          if(!nombre) return null;
          var existing = state.clientes.find(function(c){ return c.nombre.toLowerCase() === nombre.toLowerCase(); });
          if(existing){
            if(zonaId) existing.zonaId = zonaId;
            if(ubicacion) existing.ubicacion = ubicacion;
            return existing;
          }
          var c = { id: uid(), nombre: nombre, zonaId: zonaId || (state.zonas[0] && state.zonas[0].id), ubicacion: ubicacion||"" };
          state.clientes.push(c); summary.clientes++;
          return c;
        }
        function ensureProducto(nombre, precio){
          nombre = String(nombre||"").trim();
          if(!nombre) return null;
          var existing = state.productos.find(function(p){ return p.nombre.toLowerCase() === nombre.toLowerCase(); });
          if(existing){ if(precio!=null) existing.precio = Number(precio)||existing.precio; return existing; }
          var p = { id: uid(), nombre: nombre, precio: Number(precio)||0 };
          state.productos.push(p); summary.productos++;
          return p;
        }

        if(wsZonas){
          sheetToRows(wsZonas).forEach(function(r){
            var nombre = r["Zona"] || r["Nombre"];
            if(nombre) ensureZona(nombre, r["Costo"] || r["Precio"]);
          });
        }
        if(wsClientas){
          sheetToRows(wsClientas).forEach(function(r){
            var nombre = r["Nombre"];
            if(!nombre) return;
            var zonaNombre = r["Zona de delivery"] || r["Zona"];
            var zona = zonaNombre ? ensureZona(zonaNombre, 0) : (state.zonas[0]||null);
            ensureCliente(nombre, zona? zona.id:null, r["Ubicacion"]);
          });
        }
        if(wsProductos){
          sheetToRows(wsProductos).forEach(function(r){
            if(r["Nombre"]) ensureProducto(r["Nombre"], r["Precio"]);
          });
        }
        if(wsVentas){
          var grouped = {};
          sheetToRows(wsVentas).forEach(function(r){
            var bId = r["Boleta ID"] || uid();
            if(!grouped[bId]){
              grouped[bId] = {
                id: uid(),
                fecha: r["Fecha"] ? new Date(r["Fecha"]).toISOString() : new Date().toISOString(),
                clienteNombre: r["Clienta"] || "Sin nombre",
                zonaNombre: r["Zona delivery"] || "-",
                zonaPrecio: Number(r["Costo delivery"])||0,
                items: [], subtotal:0, total:0
              };
            }
            grouped[bId].items.push({ nombre:r["Producto"]||"Producto", cantidad:Number(r["Cantidad"])||1, precio:Number(r["Precio unit."])||0 });
          });
          Object.keys(grouped).forEach(function(k){
            var v = grouped[k];
            v.subtotal = v.items.reduce(function(a,it){return a+it.precio*it.cantidad;},0);
            v.total = v.subtotal + v.zonaPrecio;
            state.ventas.push(v);
            summary.ventas++;
          });
        }
        if(wsLive){
          sheetToRows(wsLive).forEach(function(r){
            var nombre = r["Nombre"] || r["Clienta"];
            var prod = r["Producto"];
            if(!nombre || !prod) return;
            var c = ensureCliente(nombre, null, "");
            ensureProducto(prod, r["Precio"]);
            state.live.push({
              id: uid(), clienteId: c? c.id:null, clienteNombre: String(nombre),
              producto: String(prod), cantidad: Number(r["Cantidad"])||1, precio: Number(r["Precio"])||0
            });
            summary.live++;
          });
        } else if(wsTablaVentas){
          // compatibilidad con tu planilla original (hoja Tabla_de_Ventas): entra como lista corrida (live), tal como la anotabas
          var zonaMap = {};
          for(var rn=40; rn<=60; rn++){
            var num = wsTablaVentas.getCell("B"+rn).value;
            var desc = wsTablaVentas.getCell("C"+rn).value;
            var precio = wsTablaVentas.getCell("D"+rn).value;
            if(num == null || desc == null) break;
            var z = ensureZona(desc, precio);
            zonaMap[num] = z;
          }
          if(wsBoleta){
            for(var rr=19; rr<=200; rr++){
              var nom = wsBoleta.getCell("S"+rr).value;
              var zn = wsBoleta.getCell("T"+rr).value;
              if(nom == null) continue;
              var zref = zonaMap[zn] || state.zonas[0] || null;
              ensureCliente(nom, zref? zref.id:null, "");
            }
          }
          for(var tr2=3; tr2<=2000; tr2++){
            var nombreC = wsTablaVentas.getCell("B"+tr2).value;
            if(nombreC == null) continue;
            if(String(nombreC).trim().toLowerCase() === "total") break;
            var prodN = wsTablaVentas.getCell("C"+tr2).value;
            var cant = wsTablaVentas.getCell("D"+tr2).value;
            var prec = wsTablaVentas.getCell("E"+tr2).value;
            if(!prodN) continue;
            var clienteImportada = ensureCliente(nombreC, null, "");
            ensureProducto(prodN, prec);
            state.live.push({
              id: uid(), clienteId: clienteImportada? clienteImportada.id:null,
              clienteNombre: String(nombreC), producto: String(prodN),
              cantidad: Number(cant)||1, precio: Number(prec)||0
            });
            summary.live++;
          }
        }

        persist("zonas"); persist("clientes"); persist("productos"); persist("ventas"); persist("live");
        showToast("Importado: " + summary.clientes + " clientas, " + summary.productos + " productos, " + summary.ventas + " boletas, " + summary.live + " filas del live");
        render();
      }).catch(function(err){
        console.error(err);
        showToast("No se pudo leer ese Excel");
      });
    };
    reader.readAsArrayBuffer(file);
  }

  function valorAnot(a){ return regMetrica==="unidades" ? (Number(a.cantidad)||0) : a.precio*a.cantidad; }

  /* ---------- insights (texto corto arriba del grafico) ---------- */
  function insightsAnot(lista){
    if(!lista.length) return [];
    if(regDiaFiltro==="todos"){
      var pd={}; lista.forEach(function(a){ var k=fechaLocalYYYYMMDD(new Date(a.fecha)); pd[k]=(pd[k]||0)+valorAnot(a); });
      var ks=Object.keys(pd), mejor=ks.reduce(function(m,k){ return !m||pd[k]>pd[m]?k:m; },null), tot=ks.reduce(function(s,k){return s+pd[k];},0);
      var ult=ks.sort().slice(-1)[0], prevs=ks.slice(0,-1), promPrev=prevs.length? prevs.reduce(function(s,k){return s+pd[k];},0)/prevs.length : 0;
      var d= promPrev? Math.round((pd[ult]-promPrev)/promPrev*100) : null;
      var cli={}; lista.forEach(function(a){ cli[a.clienteNombre.toLowerCase()]=1; });
      return [
        {k:"Días con ventas", v:String(ks.length), s:"en el registro"},
        {k:"Promedio por día", v:fmtVal(tot/ks.length), s:regMetrica==="unidades"?"unidades":"monto"},
        {k:"Mejor día", v:fmtDia(mejor), s:fmtVal(pd[mejor])},
        {k:"Último vs promedio", v: d==null?"—":(d>0?"▲ ":d<0?"▼ ":"")+Math.abs(d)+"%", s:fmtDia(ult), cls:d==null?"":(d>=0?"up":"down")},
        {k:"Clientas distintas", v:String(Object.keys(cli).length), s:"en todos los días"}
      ];
    }
    var orden=lista.slice().sort(function(a,b){ return a.fecha.localeCompare(b.fecha); });
    var t0=new Date(orden[0].fecha), t1=new Date(orden[orden.length-1].fecha);
    var mins=Math.max(1,(t1-t0)/60000);
    var tot=orden.reduce(function(s,a){ return s+valorAnot(a); },0);
    var porHora=tot/(mins/60);
    // mejor ventana de 30 min
    var best={v:0,ini:null};
    for(var i=0;i<orden.length;i++){
      var ini=new Date(orden[i].fecha), fin=ini.getTime()+30*60000, s=0;
      for(var j=i;j<orden.length && new Date(orden[j].fecha).getTime()<=fin;j++) s+=valorAnot(orden[j]);
      if(s>best.v) best={v:s,ini:ini};
    }
    // tendencia: ultimos 30 min vs 30 min anteriores
    var fin30=t1.getTime(), ini30=fin30-30*60000, ini60=fin30-60*60000, ult=0, prev=0;
    orden.forEach(function(a){ var t=new Date(a.fecha).getTime(); if(t>ini30) ult+=valorAnot(a); else if(t>ini60) prev+=valorAnot(a); });
    var tend = prev>0 ? Math.round((ult-prev)/prev*100) : null;
    var boletas={}; orden.forEach(function(a){ boletas[a.clienteNombre.toLowerCase()]=(boletas[a.clienteNombre.toLowerCase()]||0)+a.precio*a.cantidad; });
    var nCli=Object.keys(boletas).length, ticket=nCli? orden.reduce(function(s,a){return s+a.precio*a.cantidad;},0)/nCli : 0;
    var out=[
      {k:"Duración", v: (mins>=60? Math.floor(mins/60)+" h ":"")+Math.round(mins%60)+" min", s: hhmm(t0)+" – "+hhmm(t1)},
      {k:"Ritmo promedio", v: fmtVal(porHora)+"/h", s: regMetrica==="unidades"?"unidades por hora":"monto por hora"},
      {k:"Mejor media hora", v: best.ini? hhmm(best.ini)+" – "+hhmm(new Date(best.ini.getTime()+30*60000)) : "-", s: fmtVal(best.v)},
      {k:"Ticket promedio", v: money(ticket), s: nCli+" clienta(s)"}
    ];
    if(regDiaFiltro!=="todos" && mins>=45){
      out.push({k:"Tendencia", v: tend==null ? "—" : (tend>0?"▲ ":tend<0?"▼ ":"")+Math.abs(tend)+"%", s:"últimos 30 min vs 30 anteriores", cls: tend==null?"":(tend>=0?"up":"down")});
    }
    return out;
  }

  /* ---------- motor de dibujo ---------- */
  function prepCanvas(canvas){
    var dpr=window.devicePixelRatio||1, r=canvas.getBoundingClientRect();
    if(!r.width) return null;
    canvas.width=r.width*dpr; canvas.height=r.height*dpr;
    var c=canvas.getContext("2d"); c.setTransform(dpr,0,0,dpr,0,0);
    c.clearRect(0,0,r.width,r.height);
    return {c:c,w:r.width,h:r.height};
  }
  function ejesY(c, x0, y0, w, h, max, fmt){
    c.strokeStyle=cssv("--line"); c.lineWidth=1; c.fillStyle=cssv("--ink-soft"); c.font="11px 'Public Sans',sans-serif"; c.textAlign="right";
    for(var g=0; g<=4; g++){ var y=y0+h*(g/4); c.beginPath(); c.moveTo(x0,y+.5); c.lineTo(x0+w,y+.5); c.stroke(); c.fillText(fmt(max*(1-g/4)), x0-6, y+4); }
  }
  function niceMax(v){ if(v<=0) return 1; var p=Math.pow(10,Math.floor(Math.log10(v))), n=v/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; }
  function conTooltip(wrap, canvas, hits){
    var tip=wrap.querySelector("#regTip");
    canvas.onmousemove=function(e){
      var r=canvas.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top, h=null, best=1e9;
      hits.forEach(function(it){
        if(it.rect){ if(x>=it.rect[0]&&x<=it.rect[0]+it.rect[2]&&y>=it.rect[1]-4&&y<=it.rect[1]+it.rect[3]+4){ h=it; best=0; } }
        else if(it.pt){ var d=Math.hypot(x-it.pt[0],(y-it.pt[1])*0.4); if(d<best && d<28){ best=d; h=it; } }
        else if(it.arc){ var dx=x-it.arc[0], dy=y-it.arc[1], rr=Math.hypot(dx,dy); var a=Math.atan2(dy,dx); if(a<-Math.PI/2) a+=Math.PI*2;
          if(rr>=it.arc[2]&&rr<=it.arc[3]&&a>=it.arc[4]&&a<=it.arc[5]) h=it; }
      });
      if(!h){ tip.style.opacity=0; return; }
      tip.innerHTML=h.tip; tip.style.opacity=1;
      var tw=tip.offsetWidth, left=Math.min(r.width-tw-4, Math.max(4, x+12)), top=Math.max(4, y-tip.offsetHeight-10);
      tip.style.left=left+"px"; tip.style.top=top+"px";
    };
    canvas.onmouseleave=function(){ tip.style.opacity=0; };
    canvas.ontouchstart=function(e){ var t=e.touches[0]; canvas.onmousemove({clientX:t.clientX,clientY:t.clientY}); };
  }

  function grRitmo(p, wrap, canvas, lista){

  function drawHourChart(canvas, data, pico){
    if(!canvas) return;
    var dpr=window.devicePixelRatio||1, r=canvas.getBoundingClientRect(); if(!r.width) return;
    canvas.width=r.width*dpr; canvas.height=r.height*dpr;
    var c=canvas.getContext("2d"); c.scale(dpr,dpr);
    var cs=getComputedStyle(document.body), w=r.width, h=r.height, pl=56, pb=24, pt=14;
    var max=Math.max.apply(null,data.map(function(x){return x.amount;}).concat([1]));
    c.clearRect(0,0,w,h);
    c.strokeStyle=cs.getPropertyValue("--line"); c.lineWidth=1;
    c.fillStyle=cs.getPropertyValue("--ink-soft"); c.font="11px Public Sans, sans-serif";
    for(var g=0; g<=3; g++){ var y=pt+(h-pt-pb)*(g/3); c.beginPath(); c.moveTo(pl,y); c.lineTo(w-6,y); c.stroke(); c.textAlign="right"; c.fillText(money(max*(1-g/3)),pl-6,y+4); }

    data.forEach(function(x,i){
      var bx=pl+slot*i+(slot-bw)/2, bh=(h-pt-pb)*(x.amount/max);

      c.fillRect(bx,h-pb-bh,bw,Math.max(bh,x.amount>0?2:1));
      c.globalAlpha=1;
      if(i%2===0 || slot>26){ c.fillStyle=cs.getPropertyValue("--ink-soft"); c.textAlign="center"; c.fillText(String(i).padStart(2,"0"),bx+bw/2,h-7); }
    });
  }

  var AUDIO_EXT = /\.(mp3|m4a|aac|wav|ogg|oga|opus|flac|webm)$/i;
  var player = { audio: new Audio(), lista: [], idx: -1, aleatorio: false, repetir: false, cargando: false, cargada: false, origen: "", carpetaHandle: null, necesitaPermiso: false };
  player.audio.preload = "metadata";
