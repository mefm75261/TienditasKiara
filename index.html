  function aplicarVelocidad(){ player.audio.defaultPlaybackRate = player.velocidad; player.audio.playbackRate = player.velocidad; try{ player.audio.preservesPitch = true; }catch(e){} }
  function nombreCancion(src){ try{ return decodeURIComponent(String(src).split("/").pop().split("?")[0]).replace(AUDIO_EXT,""); }catch(e){ return src; } }
  function urlCancion(nombre){ return CARPETA_CANCIONES + nombre.split("/").map(encodeURIComponent).join("/"); }
  function agregarCanciones(items){
    items.forEach(function(it){ if(!player.lista.some(function(x){ return x.key===it.key; })) player.lista.push(it); });
    player.lista.sort(function(a,b){ return a.nombre.localeCompare(b.nombre,"es",{numeric:true}); });
  }
  // 1) listado de carpeta del servidor (Apache, nginx, Live Server, python http.server, etc.)
  function leerListadoServidor(){
    return fetch(CARPETA_CANCIONES,{cache:"no-store"}).then(function(r){
      if(!r.ok) return [];
      return r.text().then(function(txt){
        var doc=new DOMParser().parseFromString(txt,"text/html"), out=[];
        doc.querySelectorAll("a[href]").forEach(function(a){
          var href=a.getAttribute("href").split("?")[0].split("#")[0];
          if(!AUDIO_EXT.test(href)) return;
          var nombre; try{ nombre=decodeURIComponent(href.split("/").pop()); }catch(e){ nombre=href.split("/").pop(); }
          out.push({ key:"srv:"+nombre, nombre:nombreCancion(nombre), src:urlCancion(nombre) });
        });
        return out;
      });
    }).catch(function(){ return []; });
  }
  // 2) GitHub Pages: pregunta a GitHub que archivos hay en la carpeta
  function leerListadoGithub(){
    var host=location.hostname;
    if(!/\.github\.io$/i.test(host)) return Promise.resolve([]);
    var owner=host.split(".")[0], partes=location.pathname.split("/").filter(Boolean);
    var esRepoRaiz = !partes.length || /\.html?$/i.test(partes[0]);
    var repo = esRepoRaiz ? host : partes[0];
    var base = esRepoRaiz ? partes.slice(0,-1) : partes.slice(1);
    if(base.length && /\.html?$/i.test(base[base.length-1])) base.pop();
    var ruta = base.concat(CARPETA_CANCIONES.replace(/\/$/,"").split("/")).join("/");
    return fetch("https://api.github.com/repos/"+owner+"/"+repo+"/contents/"+ruta,{cache:"no-store"})
      .then(function(r){ return r.ok ? r.json() : []; })
      .then(function(arr){ return (Array.isArray(arr)?arr:[]).filter(function(f){ return f.type==="file" && AUDIO_EXT.test(f.name); })
        .map(function(f){ return { key:"srv:"+f.name, nombre:nombreCancion(f.name), src:urlCancion(f.name) }; }); })
      .catch(function(){ return []; });
  }
  // 3) respaldo opcional: canciones/lista.json
  function leerListaJson(){
    return fetch(CARPETA_CANCIONES+"lista.json",{cache:"no-store"}).then(function(r){ return r.ok ? r.json() : []; })
      .then(function(arr){ return (arr||[]).filter(function(n){ return AUDIO_EXT.test(n); }).map(function(n){ return { key:"srv:"+n, nombre:nombreCancion(n), src:urlCancion(n) }; }); })
      .catch(function(){ return []; });
  }
  // 4) carpeta elegida en este equipo (se recuerda entre sesiones en Chrome/Edge)
  function idbHandle(modo, valor){
    return new Promise(function(res){
      try{
        var rq=indexedDB.open("tk-musica",1);
        rq.onupgradeneeded=function(){ rq.result.createObjectStore("h"); };
        rq.onsuccess=function(){ var db=rq.result, tx=db.transaction("h",modo==="get"?"readonly":"readwrite"), st=tx.objectStore("h");
          var op = modo==="get" ? st.get("carpeta") : st.put(valor,"carpeta");
          op.onsuccess=function(){ res(modo==="get"?op.result:true); }; op.onerror=function(){ res(null); }; };
        rq.onerror=function(){ res(null); };
      }catch(e){ res(null); }
    });
  }
  function leerHandleCarpeta(dir, prefijo){
    var out=[];
    async function walk(d, pre){
      for await (const entry of d.values()){
        if(entry.kind==="file" && AUDIO_EXT.test(entry.name)){
          var f=await entry.getFile();
          out.push({ key:"loc:"+pre+entry.name, nombre:nombreCancion(entry.name), src:URL.createObjectURL(f) });
        } else if(entry.kind==="directory"){ await walk(entry, pre+entry.name+"/"); }
      }
    }
    return walk(dir, prefijo||"").then(function(){ return out; });
  }
  function soltarCancionesLocales(){
    player.lista=player.lista.filter(function(x){ if(x.key.indexOf("loc:")===0){ try{URL.revokeObjectURL(x.src);}catch(e){} return false; } return true; });
  }
  function cargarListaCanciones(forzar){
    if(player.cargando) return Promise.resolve();
    if(player.cargada && !forzar) return Promise.resolve();
    player.cargando=true;
    var esWeb = /^https?:$/.test(location.protocol);
    var tareas = esWeb ? [leerListadoServidor(), leerListadoGithub(), leerListaJson()] : [];
    return Promise.all(tareas).then(function(res){
      if(forzar) player.lista=player.lista.filter(function(x){ return x.key.indexOf("srv:")!==0; });
      var srv=[].concat.apply([],res); agregarCanciones(srv);
      if(srv.length) player.origen="Carpeta "+CARPETA_CANCIONES;
      return idbHandle("get");
    }).then(function(h){
      if(!h || !h.queryPermission) return;
      player.carpetaHandle=h;
      return h.queryPermission({mode:"read"}).then(function(p){
        if(p==="granted"){ soltarCancionesLocales(); return leerHandleCarpeta(h).then(function(arr){ agregarCanciones(arr); player.necesitaPermiso=false; if(arr.length) player.origen="Carpeta “"+h.name+"”"; }); }
        player.necesitaPermiso=true;
      });
    }).catch(function(){}).then(function(){ player.cargando=false; player.cargada=true; });
  }
  function elegirCarpetaMusica(){
    if(window.showDirectoryPicker){
      window.showDirectoryPicker({id:"tk-canciones",mode:"read"}).then(function(h){
        player.carpetaHandle=h; idbHandle("put",h);
        soltarCancionesLocales();
        return leerHandleCarpeta(h).then(function(arr){ agregarCanciones(arr); player.necesitaPermiso=false; player.origen="Carpeta “"+h.name+"”";
          showToast(arr.length+" canción(es) cargadas de “"+h.name+"”"); pintarReproductor(); });
      }).catch(function(){});
    } else {
      var inp=document.getElementById("plDir"); if(inp) inp.click();
    }
  }
  function reconectarCarpeta(){
    var h=player.carpetaHandle; if(!h) return elegirCarpetaMusica();
    h.requestPermission({mode:"read"}).then(function(p){
      if(p!=="granted") return;
      soltarCancionesLocales();
      return leerHandleCarpeta(h).then(function(arr){ agregarCanciones(arr); player.necesitaPermiso=false; player.origen="Carpeta “"+h.name+"”"; pintarReproductor(); });
    }).catch(function(){});
  }
  function fmtT(t){ if(!isFinite(t)||t<0) t=0; var m=Math.floor(t/60), s=Math.floor(t%60); return m+":"+String(s).padStart(2,"0"); }
  function reproducir(i){
    if(!player.lista.length) return;
    player.idx = (i + player.lista.length) % player.lista.length;
    player.audio.src = player.lista[player.idx].src;
    aplicarVelocidad();
    player.audio.play().catch(function(){ showToast("No se pudo reproducir esta canción"); });
    pintarReproductor();
  }
  function siguiente(){
    if(!player.lista.length) return;
    if(player.aleatorio && player.lista.length>1){ var n; do{ n=Math.floor(Math.random()*player.lista.length); }while(n===player.idx); reproducir(n); }
    else reproducir(player.idx+1);
  }
  player.audio.addEventListener("ended", function(){ if(player.repetir){ player.audio.currentTime=0; player.audio.play(); } else siguiente(); });
  player.audio.addEventListener("error", function(){ if(player.idx>=0){ showToast("No se pudo abrir: "+player.lista[player.idx].nombre); } });
  ["play","pause"].forEach(function(ev){ player.audio.addEventListener(ev, pintarReproductor); });
  player.audio.addEventListener("timeupdate", function(){
    var bar=document.getElementById("plBar"), tc=document.getElementById("plCur"), td=document.getElementById("plDur");
    if(bar && !bar._drag){ bar.max = player.audio.duration||0; bar.value = player.audio.currentTime; }
    if(tc) tc.textContent=fmtT(player.audio.currentTime); if(td) td.textContent=fmtT(player.audio.duration);
  });
  function pintarReproductor(){
    var box=document.getElementById("playerBox"); if(!box) return;
    cargarListaCanciones().then(function(){
      box=document.getElementById("playerBox"); if(!box) return;
      var cur = player.idx>=0 ? player.lista[player.idx] : null, sonando = !player.audio.paused;
      var spd=[1,1.5,2].map(function(v){ return '<button type="button" class="spd'+(player.velocidad===v?' on':'')+'" data-v="'+v+'" aria-pressed="'+(player.velocidad===v)+'" title="Velocidad x'+v+'">x'+v+'</button>'; }).join("");
      var h='<div class="pl-top"><div class="player-disc'+(sonando?' spin':'')+'"></div><div class="pl-info"><div class="player-title" title="'+(cur?escapeAttr(cur.nombre):"")+'">'+(cur?escapeHtml(cur.nombre):"Nada sonando")+'</div><div class="player-sub">'+player.lista.length+' canción(es)'+(player.origen?' · '+escapeHtml(player.origen):'')+'</div></div></div>'+
        '<div class="pl-prog"><span id="plCur">'+fmtT(player.audio.currentTime)+'</span><input type="range" class="player-bar" id="plBar" min="0" max="'+(player.audio.duration||0)+'" step="0.1" value="'+player.audio.currentTime+'" aria-label="Avance"><span id="plDur">'+fmtT(player.audio.duration)+'</span></div>'+
        '<div class="pl-ctrl-row"><div class="player-ctrls"><button type="button" id="plShuf" class="'+(player.aleatorio?'on':'')+'" aria-label="Aleatorio">'+ICO.shuffle+'</button><button type="button" id="plPrev" aria-label="Anterior">'+ICO.prev+'</button><button type="button" id="plPlay" class="main" aria-label="Reproducir o pausar">'+(sonando?ICO.pause:ICO.play)+'</button><button type="button" id="plNext" aria-label="Siguiente">'+ICO.next+'</button><button type="button" id="plRep" class="'+(player.repetir?'on':'')+'" aria-label="Repetir">'+ICO.repeat+'</button></div>'+
        '<div class="player-speed" role="group" aria-label="Velocidad">'+spd+'</div></div>'+
        '<div class="player-vol">'+ICO.vol+'<input type="range" id="plVol" class="player-bar" min="0" max="1" step="0.05" value="'+player.audio.volume+'" aria-label="Volumen"></div>'+
        '<input type="file" id="plDir" webkitdirectory directory multiple style="display:none">';
      var tools=document.getElementById("playerTools");
      if(tools){
        tools.innerHTML=(player.necesitaPermiso ? '<button type="button" class="btn btn-primary btn-sm" id="plReconectar">Reconectar carpeta</button>' : '<button type="button" class="icon-btn" id="plCarpeta" aria-label="Elegir carpeta">'+ICO.folder+'</button>')+
          '<button type="button" class="icon-btn" id="plRefrescar" aria-label="Actualizar lista">'+ICO.refresh+'</button>';
      }
      if(player.lista.length){
        h+='<div class="player-list">'+player.lista.map(function(s,i){ return '<div class="player-item'+(i===player.idx?' cur':'')+'" data-i="'+i+'" role="button" tabindex="0"><span class="pi-n">'+(i===player.idx&&sonando?'▶':(i+1))+'</span><span class="pi-t">'+escapeHtml(s.nombre)+'</span></div>'; }).join("")+'</div>';
      } else {
        h+='<div class="player-empty">'+(player.necesitaPermiso
          ? 'Toca <b>Reconectar carpeta</b> para volver a leer tu música.'
          : 'Sin canciones. Pon tus archivos en <b>'+escapeHtml(CARPETA_CANCIONES)+'</b> y toca <span class="inl">'+ICO.refresh+'</span>, o elige la carpeta con <span class="inl">'+ICO.folder+'</span>.')+'</div>';
      }
      box.innerHTML=h;
      box.querySelector("#plPlay").onclick=function(){ if(!player.lista.length){ elegirCarpetaMusica(); return; } if(player.idx<0) reproducir(player.aleatorio?Math.floor(Math.random()*player.lista.length):0); else if(player.audio.paused) player.audio.play(); else player.audio.pause(); };
      box.querySelector("#plPrev").onclick=function(){ if(player.audio.currentTime>3){ player.audio.currentTime=0; } else reproducir(player.idx-1); };
      box.querySelector("#plNext").onclick=siguiente;
      box.querySelector("#plShuf").onclick=function(){ player.aleatorio=!player.aleatorio; pintarReproductor(); };
      box.querySelector("#plRep").onclick=function(){ player.repetir=!player.repetir; pintarReproductor(); };
      box.querySelectorAll(".player-speed .spd").forEach(function(b){ b.onclick=function(){ player.velocidad=Number(b.dataset.v)||1; aplicarVelocidad(); pintarReproductor(); }; });
      box.querySelector("#plVol").oninput=function(e){ player.audio.volume=Number(e.target.value); };
      var bar=box.querySelector("#plBar");
      bar.addEventListener("pointerdown",function(){ bar._drag=true; });
      bar.addEventListener("change",function(){ player.audio.currentTime=Number(bar.value)||0; bar._drag=false; });
      var tl=document.getElementById("playerTools")||box;
      var bc=tl.querySelector("#plCarpeta"); if(bc) bc.onclick=elegirCarpetaMusica;
      var br=tl.querySelector("#plReconectar"); if(br) br.onclick=reconectarCarpeta;
      tl.querySelector("#plRefrescar").onclick=function(){
        var antes=player.lista.length;
        cargarListaCanciones(true).then(function(){ showToast(player.lista.length+" canción(es) en la lista"+(player.lista.length>antes?" (+"+(player.lista.length-antes)+" nuevas)":"")); pintarReproductor(); });
      };
      box.querySelector("#plDir").onchange=function(e){
        soltarCancionesLocales();
        var arr=Array.prototype.filter.call(e.target.files,function(f){ return AUDIO_EXT.test(f.name); }).map(function(f){ return { key:"loc:"+(f.webkitRelativePath||f.name), nombre:nombreCancion(f.name), src:URL.createObjectURL(f) }; });
        agregarCanciones(arr); player.origen="Carpeta de este equipo";
        showToast(arr.length+" canción(es) cargadas"); pintarReproductor();
      };
      box.querySelectorAll(".player-item").forEach(function(it){ it.onclick=function(){ reproducir(Number(it.dataset.i)); }; it.onkeydown=function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); reproducir(Number(it.dataset.i)); } }; });
    });
  }

        // celular: tarjeta pegada abajo (o arriba si el elemento esta abajo)
        tipEl.style.left="8px";
        var abajo = (r.top + r.height/2) < innerHeight*0.55;
        tipEl.style.top = abajo ? (innerHeight-th-8)+"px" : "8px";
        return;
      }
      if(r.bottom+12+th < innerHeight) top=r.bottom+12;
      else if(r.top-12-th > 0) top=r.top-12-th;
      else top=Math.max(12, innerHeight-th-12);
      left=Math.max(12, Math.min(innerWidth-tw-12, r.left));
      tipEl.style.top=top+"px"; tipEl.style.left=left+"px";
    }
    function mostrar(){
      var p=lista[i];
      if(p.tab && tab!==p.tab){ tab=p.tab; closeAllAuto(); render(); }
      objetivo=resolver(p);
      if(!objetivo || !visible(objetivo)){ if(i<lista.length-1){ i++; return mostrar(); } return cerrar(); }
      var r=objetivo.getBoundingClientRect();
      var limiteAbajo = innerWidth<=640 ? innerHeight*0.55 : innerHeight-180;
      if(r.top<70 || r.bottom>limiteAbajo) objetivo.scrollIntoView({block: (r.height>innerHeight*0.45 || innerWidth<=640) ? "start":"center"});
      var pct=Math.round((i+1)/lista.length*100);
      tipEl.innerHTML='<div class="t-sec">'+escapeHtml(p.sec||"")+'</div><h4>'+(p.ico&&BI[p.ico]?'<span class="bi">'+BI[p.ico]+'</span>':'')+escapeHtml(p.t)+'</h4><p>'+escapeHtml(p.d||"")+'</p>'+
        '<div class="tour-bar"><i style="width:'+pct+'%"></i></div>'+
        '<div class="tour-nav"><span class="cnt">'+(i+1)+' / '+lista.length+'</span><div class="grp">'+
        '<button type="button" class="btn btn-ghost btn-sm" data-a="salir">Salir</button>'+
        '<button type="button" class="btn btn-ghost btn-sm" data-a="ant"'+(i===0?' disabled':'')+'>'+BI.chevL.replace('<svg','<svg style="width:14px;height:14px"')+'</button>'+
        '<button type="button" class="btn btn-primary btn-sm" data-a="sig">'+(i===lista.length-1?'Finalizar':'Siguiente')+'</button></div></div>';
      tipEl.querySelector('[data-a="salir"]').onclick=cerrar;
      tipEl.querySelector('[data-a="ant"]').onclick=function(){ if(i>0){ i--; mostrar(); } };
      tipEl.querySelector('[data-a="sig"]').onclick=function(){ if(i<lista.length-1){ i++; mostrar(); } else cerrar(); };
      requestAnimationFrame(ubicar);
    }
    function teclas(e){
      if(e.key==="Escape"){ e.preventDefault(); cerrar(); }
      else if(e.key==="ArrowRight"||e.key==="Enter"){ e.preventDefault(); if(i<lista.length-1){ i++; mostrar(); } else cerrar(); }
      else if(e.key==="ArrowLeft"){ e.preventDefault(); if(i>0){ i--; mostrar(); } }
    }
    block.onclick=function(){};
    document.addEventListener("keydown",teclas,true);
    window.addEventListener("resize",ubicar); window.addEventListener("scroll",ubicar,true);
    mostrar();
  }
  // compatibilidad: todo lo que antes llamaba al recorrido ahora abre el selector de ayuda
  function startHelpTour(){ abrirAyuda(); }
  document.getElementById("btnAyudaTop").addEventListener("click", abrirAyuda);
  decorarBotones(document);
  /* ---------- init ---------- */
  document.getElementById("btnExportar").addEventListener("click", function(){ exportExcel(); });
  document.getElementById("btnImportarTrigger").addEventListener("click", function(){
    document.getElementById("fileImportar").click();
  });

  document.getElementById("btnImagenes").addEventListener("click", function(){ abrirPanelImagenes(); });
  document.getElementById("btnGuardarCopia").addEventListener("click", function(){ guardarCopiaCompleta(); });
  document.getElementById("btnCargarCopiaTrigger").addEventListener("click", function(){
    document.getElementById("fileCopia").click();
  });
  document.getElementById("fileCopia").addEventListener("change", function(e){

  document.getElementById("btnCargarNube").addEventListener("click", function(){ cargarDeLaNube(); });

  function construirCopiaCompleta(){
    return {
      tipo: "tienditas_kiara_copia",
      version: 1,
      fecha: new Date().toISOString(),
      config: state.config,
      productos: state.productos,
      clientes: state.clientes,
      zonas: state.zonas,
      ventas: state.ventas,
      live: state.live,
      liveDescuentos: state.liveDescuentos,
      compartidos: state.compartidos,
      anotaciones: state.anotaciones
    };
  }

  function aplicarCopiaCompleta(copia){
    if(!copia || copia.tipo !== "tienditas_kiara_copia") return false;
    state.config = copia.config || state.config;
    state.productos = copia.productos || [];
    state.clientes = copia.clientes || [];
    state.zonas = (copia.zonas && copia.zonas.length) ? copia.zonas : defaultZonas();
    state.ventas = copia.ventas || [];
    state.live = copia.live || [];
    state.liveDescuentos = copia.liveDescuentos || {};
    state.compartidos = copia.compartidos || [];
    if(copia.anotaciones) state.anotaciones = copia.anotaciones;
    persist("anotaciones");
    persist("config"); persist("productos"); persist("clientes"); persist("zonas");
    persist("ventas"); persist("live"); persist("liveDescuentos"); persist("compartidos");
    document.getElementById("shopname").textContent = state.config.tienda;
    render();
    return true;
  }

  function guardarCopiaCompleta(){
    var copia = construirCopiaCompleta();
    var blob = new Blob([JSON.stringify(copia)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    var fecha = fechaLocalYYYYMMDD(new Date());
    a.href = url;
    a.download = (state.config.tienda || "tienda").replace(/[^a-z0-9]+/gi,"_") + "_copia_" + fecha + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    showToast("Copia guardada. Comparte ese archivo o guardalo para abrirlo en otro computador.");
  }

  function cargarCopiaCompleta(file){
    var reader = new FileReader();
    reader.onload = function(e){
      var copia;
      try { copia = JSON.parse(e.target.result); }
      catch(err){ showToast("Ese archivo no es una copia valida"); return; }
      if(aplicarCopiaCompleta(copia)){
        showToast("Copia cargada, aqui esta todo lo que tenias");
      } else {
        showToast("Ese archivo no es una copia valida");
      }
    };
    reader.readAsText(file);
  }

  // ---------- Firebase (guardar/cargar en la nube, solo manual) ----------
  function inicializarFirebase(){
    if(typeof firebase === "undefined") return null;
    if(!window.FIREBASE_CONFIG || !window.FIREBASE_CONFIG.apiKey || window.FIREBASE_CONFIG.apiKey.indexOf("PEGA_AQUI") === 0){
      return null;
    }
    try{
      if(!firebase.apps || !firebase.apps.length){
        firebase.initializeApp(window.FIREBASE_CONFIG);
      }
      return firebase.firestore();
    } catch(e){
      return null;
    }
  }

  function guardarEnLaNube(){
  var db = inicializarFirebase();
  if(!db){ showToast("Falta configurar firebase-config.js con los datos de tu proyecto"); return; }
  var ruta = window.FIREBASE_DOC_PATH || { collection: "tienditas_kiara", doc: "datos" };
  showToast("Guardando en la nube...");

  var copia = JSON.parse(JSON.stringify(construirCopiaCompleta()));
  // reconstruimos config limpio, sin las imagenes (pesadas e innecesarias para la busqueda)
  copia.config = Object.assign({}, state.config);
  if(copia.config.brands) copia.config.brands=copia.config.brands.map(function(b){return {id:b.id,nombre:b.nombre,imageDataUri:""};});
  delete copia.config.logoDataUri; delete copia.config.mascota1DataUri; delete copia.config.mascota2DataUri;

  db.collection(ruta.collection).doc(ruta.doc).set(copia)
    .then(function(){ showToast("Guardado en la nube ✓ ya puede buscarse online"); })
    .catch(function(err){ showToast("No se pudo guardar en la nube: " + (err && err.message ? err.message : "revisa la conexion")); });
  }

  function cargarDeLaNube(){
    var db = inicializarFirebase();
    if(!db){ showToast("Falta configurar firebase-config.js con los datos de tu proyecto"); return; }
    var ruta = window.FIREBASE_DOC_PATH || { collection: "tienditas_kiara", doc: "datos" };
    showToast("Cargando desde la nube...");
    db.collection(ruta.collection).doc(ruta.doc).get()
      .then(function(snap){
        if(!snap.exists){ showToast("Aun no hay nada guardado en la nube"); return; }
        if(aplicarCopiaCompleta(snap.data())){
          showToast("Datos traidos desde la nube");
        } else {
          showToast("Los datos guardados en la nube no son validos");
        }
      })
      .catch(function(err){ showToast("No se pudo cargar: " + (err && err.message ? err.message : "revisa la conexion")); });
  }

  function refrescarImagenesHeader(){
    var hl = document.getElementById("headerLogo");
    var hm = document.getElementById("headerMascota");
    if(hl){ hl.style.display = ""; hl.src = getLogoSrc(); }
    if(hm){ hm.style.display = ""; hm.src = getMascota1Src(); }
  }

  function leerComoDataUri(file, cb){
    var reader = new FileReader();
    reader.onload = function(e){ cb(e.target.result); };
    reader.readAsDataURL(file);
  }

  function abrirPanelImagenes(){
    var overlay = document.createElement("div");
    overlay.className = "overlay";

    function fila(id, label, srcActual, esExterna){
      return '<div class="img-config-row">' +
        '<img class="img-config-preview" src="'+srcActual+'" onerror="this.style.opacity=\'0.15\'">' +
        '<div class="img-config-info"><b>'+label+'</b>' +
          (esExterna ? '<span class="img-config-warn">Desde archivo local (puede bloquear "Copiar imagen")</span>' : '<span class="img-config-ok">Guardada, lista para copiar</span>') +
        '</div>' +
        '<button class="btn btn-ghost btn-sm" data-id="'+id+'">Subir</button>' +
      '</div>';
    }

    overlay.innerHTML =
      '<div class="boleta-wrap">' +
        '<div class="boleta" style="text-align:left;">' +
          '<h3 style="text-align:center;">Imagenes</h3>' +
          '<div class="sub" style="text-align:center;">Subelas una vez desde tu computador y quedan guardadas aqui mismo, asi "Copiar imagen" de la boleta funciona siempre, sin importar la carpeta.</div>' +
          '<hr>' +
          fila("logo", "Logo de la tienda", getLogoSrc(), !state.config.logoDataUri) +
          fila("mascota1", "Mascota (arriba, junto al nombre)", getMascota1Src(), !state.config.mascota1DataUri) +
          fila("mascota2", "Mascota (abajo de la boleta)", getMascota2Src(), !state.config.mascota2DataUri) +
          '<input type="file" id="imgConfigFile" accept="image/*" style="display:none;">' +
        '</div>' +
        '<div class="overlay-actions">' +
          '<button class="btn btn-ghost" id="btnCerrarImagenes">Cerrar</button>' +
        '</div>' +
      '</div>';

    document.body.appendChild(overlay);
    overlay.onclick = function(e){ if(e.target === overlay) overlay.remove(); };
    overlay.querySelector("#btnCerrarImagenes").onclick = function(){ overlay.remove(); };

    var fileInput = overlay.querySelector("#imgConfigFile");
    var targetId = null;
    overlay.querySelectorAll("[data-id]").forEach(function(btn){
      btn.addEventListener("click", function(){
        targetId = btn.getAttribute("data-id");
        fileInput.click();
      });
    });
    fileInput.addEventListener("change", function(e){
      var file = e.target.files[0];
      e.target.value = "";
      if(!file || !targetId) return;
      leerComoDataUri(file, function(dataUri){
        if(targetId === "logo") state.config.logoDataUri = dataUri;
        if(targetId === "mascota1") state.config.mascota1DataUri = dataUri;
        if(targetId === "mascota2") state.config.mascota2DataUri = dataUri;
        persist("config");
        refrescarImagenesHeader();
        showToast("Imagen guardada");
        overlay.remove();
        abrirPanelImagenes();
      });
    });
  }

  var appEl = document.getElementById("app");
  appEl.style.opacity = "0.4";

  var landingEl = document.getElementById("landingScreen");
  var landingDateEl = document.getElementById("landingDate");
  var diasSemana = ["Domingo","Lunes","Martes","Miercoles","Jueves","Viernes","Sabado"];

  landingDateEl.textContent = diasSemana[hoyPC.getDay()] + " " + hoyPC.getDate() + " de " + meses[hoyPC.getMonth()] + ", " + hoyPC.getFullYear();

  loadAll().then(function(){
    document.getElementById("shopname").textContent = state.config.tienda;
    applyTheme();
    refrescarImagenesHeader();
    appEl.style.opacity = "1";
    render();
    if(document.fonts && document.fonts.ready){
      document.fonts.ready.then(function(){
        if(tab === "vender") render();
      });
    }
  });

})();
