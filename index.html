  /* ==================================================================
     EXPORTAR / IMPORTAR EXCEL (estilo rosado, igual espiritu que tu planilla)
     ================================================================== */
  var PINK_HEADER = "FFF7AFCE";
  var PINK_SOFT = "FFFBD5E5";
  var INK_HEX = "FF5B2A4D";

  function styleHeaderRow(row){
    row.eachCell(function(cell){
      cell.fill = { type:"pattern", pattern:"solid", fgColor:{argb:PINK_HEADER} };
      cell.font = { bold:true, color:{argb:INK_HEX} };
      cell.alignment = { vertical:"middle" };
      cell.border = { bottom:{style:"thin", color:{argb:PINK_HEADER}} };
    });
  }
  function styleBodyRow(row, i){
    if(i % 2 === 0){
      row.eachCell(function(cell){
        cell.fill = { type:"pattern", pattern:"solid", fgColor:{argb:PINK_SOFT} };
      });
    }
  }

  function exportExcel(){
    if(typeof ExcelJS === "undefined"){ showToast("No se pudo cargar el modulo Excel"); return; }
    var wb = new ExcelJS.Workbook();
    wb.creator = state.config.tienda;

    // Clientas
    var wsC = wb.addWorksheet("Clientas");
    wsC.columns = [
      { header:"Nombre", key:"nombre", width:28 },
      { header:"Zona de delivery", key:"zona", width:24 },
      { header:"Ubicacion", key:"ubicacion", width:34 }
    ];
    styleHeaderRow(wsC.getRow(1));
    state.clientes.forEach(function(c, i){
      var z = findZona(c.zonaId);
      var row = wsC.addRow({ nombre:c.nombre, zona: z? z.nombre:"", ubicacion: c.ubicacion||"" });
      styleBodyRow(row, i);
    });

    // Productos
    var wsP = wb.addWorksheet("Productos");
    wsP.columns = [
      { header:"Nombre", key:"nombre", width:30 },
      { header:"Precio", key:"precio", width:14 }
    ];
    styleHeaderRow(wsP.getRow(1));
    state.productos.forEach(function(p, i){
      var row = wsP.addRow({ nombre:p.nombre, precio:p.precio });
      styleBodyRow(row, i);
    });

    // Zonas
    var wsZ = wb.addWorksheet("Zonas");
    wsZ.columns = [
      { header:"Zona", key:"nombre", width:28 },
      { header:"Costo", key:"precio", width:14 }
    ];
    styleHeaderRow(wsZ.getRow(1));
    state.zonas.forEach(function(z, i){
      var row = wsZ.addRow({ nombre:z.nombre, precio:z.precio });
      styleBodyRow(row, i);
    });

    // Ventas (una fila por producto, agrupable por Boleta ID)
    var wsV = wb.addWorksheet("Ventas");
    wsV.columns = [
      { header:"Boleta ID", key:"boletaId", width:14 },
      { header:"Fecha", key:"fecha", width:18 },
      { header:"Clienta", key:"clienta", width:26 },
      { header:"Producto", key:"producto", width:26 },
      { header:"Cantidad", key:"cantidad", width:10 },
      { header:"Precio unit.", key:"precio", width:12 },
      { header:"Total item", key:"totalItem", width:12 },
      { header:"Zona delivery", key:"zona", width:22 },
      { header:"Costo delivery", key:"delivery", width:14 },
      { header:"Descuento", key:"descuento", width:12 },
      { header:"Total boleta", key:"totalBoleta", width:14 }
    ];
    styleHeaderRow(wsV.getRow(1));
    var rIdx = 0;
    state.ventas.forEach(function(v){
      var d = new Date(v.fecha);
      v.items.forEach(function(it){
        var row = wsV.addRow({
          boletaId: v.id,
          fecha: d.toLocaleString("es-CL"),
          clienta: v.clienteNombre,
          producto: it.nombre,
          cantidad: it.cantidad,
          precio: it.precio,
          totalItem: it.precio*it.cantidad,
          zona: v.zonaNombre,
          delivery: v.zonaPrecio,
          descuento: v.descuento||0,
          totalBoleta: v.total
        });
        styleBodyRow(row, rIdx++);
      });
    });

    // Live actual (lista corrida sin facturar aun, tipo tu planilla original)
    var wsL = wb.addWorksheet("Live_actual");
    wsL.columns = [
      { header:"Nombre", key:"nombre", width:26 },
      { header:"Producto", key:"producto", width:26 },
      { header:"Cantidad", key:"cantidad", width:10 },
      { header:"Precio", key:"precio", width:12 },
      { header:"Total", key:"total", width:12 }
    ];
    styleHeaderRow(wsL.getRow(1));
    state.live.forEach(function(r, i){
      var row = wsL.addRow({
        nombre: r.clienteNombre,
        producto: r.producto,
        cantidad: r.cantidad,
        precio: r.precio,
        total: r.precio*r.cantidad
      });
      styleBodyRow(row, i);
    });

    wb.xlsx.writeBuffer().then(function(buffer){
      var blob = new Blob([buffer], { type:"application/octet-stream" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      var fecha = fechaLocalYYYYMMDD(new Date());
      a.href = url;
      a.download = (state.config.tienda || "tienda").replace(/[^a-z0-9]+/gi,"_") + "_" + fecha + ".xlsx";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showToast("Excel descargado");
    }).catch(function(err){
      console.error(err);
      showToast("No se pudo generar el Excel");
    });
  }

  function sheetToRows(ws){
    var headers = [];
    var rows = [];
    ws.eachRow(function(row, rowNumber){
      var vals = row.values; // 1-indexed, vals[0] is empty
      if(rowNumber === 1){
        for(var i=1;i<vals.length;i++){ headers.push(String(vals[i]||"").trim()); }
      } else {
        var obj = {};
        for(var j=1;j<vals.length;j++){ obj[headers[j-1]] = vals[j]; }
        rows.push(obj);
      }
    });
    return rows;
  }

  function importExcelFile(file){
    var reader = new FileReader();
    reader.onload = function(e){
      var wb = new ExcelJS.Workbook();
      wb.xlsx.load(e.target.result).then(function(){
        var summary = { clientes:0, productos:0, zonas:0, ventas:0, live:0 };
        var wsClientas = wb.getWorksheet("Clientas");
        var wsProductos = wb.getWorksheet("Productos");
        var wsZonas = wb.getWorksheet("Zonas");
        var wsVentas = wb.getWorksheet("Ventas");
        var wsLive = wb.getWorksheet("Live_actual");
        var wsTablaVentas = wb.getWorksheet("Tabla_de_Ventas");
        var wsBoleta = wb.getWorksheet("Boleta");

        function ensureZona(nombre, precio){
          nombre = String(nombre||"").trim();
          if(!nombre) return null;
          var existing = state.zonas.find(function(z){ return z.nombre.toLowerCase() === nombre.toLowerCase(); });
          if(existing) return existing;
          var z = { id: uid(), nombre: nombre, precio: Number(precio)||0 };
          state.zonas.push(z); summary.zonas++;
          return z;
        }
        function ensureCliente(nombre, zonaId, ubicacion){
          nombre = String(nombre||"").trim();
          if(!nombre) return null;
          var existing = state.clientes.find(function(c){ return c.nombre.toLowerCase() === nombre.toLowerCase(); });
          if(existing){
            if(zonaId) existing.zonaId = zonaId;
            if(ubicacion) existing.ubicacion = ubicacion;
            return existing;
          }
          var c = { id: uid(), nombre: nombre, zonaId: zonaId || (state.zonas[0] && state.zonas[0].id), ubicacion: ubicacion||"" };
          state.clientes.push(c); summary.clientes++;
          return c;
        }
        function ensureProducto(nombre, precio){
          nombre = String(nombre||"").trim();
          if(!nombre) return null;
          var existing = state.productos.find(function(p){ return p.nombre.toLowerCase() === nombre.toLowerCase(); });
          if(existing){ if(precio!=null) existing.precio = Number(precio)||existing.precio; return existing; }
          var p = { id: uid(), nombre: nombre, precio: Number(precio)||0 };
          state.productos.push(p); summary.productos++;
          return p;
        }

        if(wsZonas){
          sheetToRows(wsZonas).forEach(function(r){
            var nombre = r["Zona"] || r["Nombre"];
            if(nombre) ensureZona(nombre, r["Costo"] || r["Precio"]);
          });
        }
        if(wsClientas){
          sheetToRows(wsClientas).forEach(function(r){
            var nombre = r["Nombre"];
            if(!nombre) return;
            var zonaNombre = r["Zona de delivery"] || r["Zona"];
            var zona = zonaNombre ? ensureZona(zonaNombre, 0) : (state.zonas[0]||null);
            ensureCliente(nombre, zona? zona.id:null, r["Ubicacion"]);
          });
        }
        if(wsProductos){
          sheetToRows(wsProductos).forEach(function(r){
            if(r["Nombre"]) ensureProducto(r["Nombre"], r["Precio"]);
          });
        }
        if(wsVentas){
          var grouped = {};
          sheetToRows(wsVentas).forEach(function(r){
            var bId = r["Boleta ID"] || uid();
            if(!grouped[bId]){
              grouped[bId] = {
                id: uid(),
                fecha: r["Fecha"] ? new Date(r["Fecha"]).toISOString() : new Date().toISOString(),
                clienteNombre: r["Clienta"] || "Sin nombre",
                zonaNombre: r["Zona delivery"] || "-",
                zonaPrecio: Number(r["Costo delivery"])||0,
                items: [], subtotal:0, total:0
              };
            }
            grouped[bId].items.push({ nombre:r["Producto"]||"Producto", cantidad:Number(r["Cantidad"])||1, precio:Number(r["Precio unit."])||0 });
          });
          Object.keys(grouped).forEach(function(k){
            var v = grouped[k];
            v.subtotal = v.items.reduce(function(a,it){return a+it.precio*it.cantidad;},0);
            v.total = v.subtotal + v.zonaPrecio;
            state.ventas.push(v);
            summary.ventas++;
          });
        }
        if(wsLive){
          sheetToRows(wsLive).forEach(function(r){
            var nombre = r["Nombre"] || r["Clienta"];
            var prod = r["Producto"];
            if(!nombre || !prod) return;
            var c = ensureCliente(nombre, null, "");
            ensureProducto(prod, r["Precio"]);
            state.live.push({
              id: uid(), clienteId: c? c.id:null, clienteNombre: String(nombre),
              producto: String(prod), cantidad: Number(r["Cantidad"])||1, precio: Number(r["Precio"])||0
            });
            summary.live++;
          });
        } else if(wsTablaVentas){
          // compatibilidad con tu planilla original (hoja Tabla_de_Ventas): entra como lista corrida (live), tal como la anotabas
          var zonaMap = {};
          for(var rn=40; rn<=60; rn++){
            var num = wsTablaVentas.getCell("B"+rn).value;
            var desc = wsTablaVentas.getCell("C"+rn).value;
            var precio = wsTablaVentas.getCell("D"+rn).value;
            if(num == null || desc == null) break;
            var z = ensureZona(desc, precio);
            zonaMap[num] = z;
          }
          if(wsBoleta){
            for(var rr=19; rr<=200; rr++){
              var nom = wsBoleta.getCell("S"+rr).value;
              var zn = wsBoleta.getCell("T"+rr).value;
              if(nom == null) continue;
              var zref = zonaMap[zn] || state.zonas[0] || null;
              ensureCliente(nom, zref? zref.id:null, "");
            }
          }
          for(var tr2=3; tr2<=2000; tr2++){
            var nombreC = wsTablaVentas.getCell("B"+tr2).value;
            if(nombreC == null) continue;
            if(String(nombreC).trim().toLowerCase() === "total") break;
            var prodN = wsTablaVentas.getCell("C"+tr2).value;
            var cant = wsTablaVentas.getCell("D"+tr2).value;
            var prec = wsTablaVentas.getCell("E"+tr2).value;
            if(!prodN) continue;
            var clienteImportada = ensureCliente(nombreC, null, "");
            ensureProducto(prodN, prec);
            state.live.push({
              id: uid(), clienteId: clienteImportada? clienteImportada.id:null,
              clienteNombre: String(nombreC), producto: String(prodN),
              cantidad: Number(cant)||1, precio: Number(prec)||0
            });
            summary.live++;
          }
        }

        persist("zonas"); persist("clientes"); persist("productos"); persist("ventas"); persist("live");
        showToast("Importado: " + summary.clientes + " clientas, " + summary.productos + " productos, " + summary.ventas + " boletas, " + summary.live + " filas del live");
        render();
      }).catch(function(err){
        console.error(err);
        showToast("No se pudo leer ese Excel");
      });
    };
    reader.readAsArrayBuffer(file);
  }

  /* ==================================================================
     TAB: COMPARTIDOS (para el sorteo de cada live)
     ================================================================== */
  function renderCompartidos(){
    var wrap = document.createElement("div");
    var card = document.createElement("div");
    card.className = "card";
    card.appendChild(el('<h2 class="section-title">Compartidos del live</h2>'));
    card.appendChild(el('<div class="muted" style="margin:-8px 0 12px; font-size:0.88rem;">Anota a quienes van comprando o compartiendo para el sorteo. Se vacia cuando tu quieras, no afecta tus ventas.</div>'));

    var addRow = document.createElement("div");
    addRow.className = "row-inline";
    addRow.innerHTML =
      '<div class="field" style="flex:2 1 200px; margin-bottom:0;"><label>Nombre</label><input type="text" id="compInput" placeholder="Nombre de la persona"></div>' +
      '<div style="flex:1 1 140px;"><label>Motivo</label><select id="compTipo"><option value="Comparte">Comparte</option><option value="Compra">Compra</option><option value="Ambos">Ambos</option></select></div>' +
      '<div style="flex:0 0 auto;"><button class="btn btn-primary" id="addCompBtn">Agregar</button></div>';
    card.appendChild(addRow);

    var compInput = addRow.querySelector("#compInput");
    var compTipo = addRow.querySelector("#compTipo");
    function addComp(){
      var nombre = compInput.value.trim();
      if(!nombre){ showToast("Escribe un nombre"); compInput.focus(); return; }
      state.compartidos.push({ id: uid(), nombre: nombre, tipo: compTipo.value });
      persist("compartidos");
      compInput.value = "";
      compInput.focus();
      render();
    }
    addRow.querySelector("#addCompBtn").onclick = addComp;
    compInput.addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); addComp(); } });

    wrap.appendChild(card);

    var compradorasCard = document.createElement("div");
    compradorasCard.className = "card";
    var compradoras = agruparLivePorCliente().map(function(g){ return { nombre: g.clienteNombre, tipo: "Compra" }; });
    compradorasCard.appendChild(el('<h2 class="section-title">Sortear entre compradoras del live</h2>'));
    compradorasCard.appendChild(el('<div class="muted" style="margin:-8px 0 12px; font-size:0.88rem;">Usa directo el listado de "Ventas de este live", sin tener que volver a anotarlas aqui. Ahora mismo hay '+compradoras.length+' clienta(s).</div>'));
    if(compradoras.length === 0){
      compradorasCard.appendChild(el('<div class="empty-state">Aun no hay compras anotadas en este live.</div>'));
    } else {
      var btnSorteoCompradoras = el('<button class="btn btn-primary">Sortear entre compradoras</button>');
      btnSorteoCompradoras.onclick = function(){ openSorteo(compradoras, "Sorteo entre compradoras"); };
      compradorasCard.appendChild(btnSorteoCompradoras);
    }
    wrap.appendChild(compradorasCard);

    var listCard = document.createElement("div");
    listCard.className = "card";
    listCard.appendChild(el('<h2 class="section-title">Lista (' + state.compartidos.length + ')</h2>'));

    if(state.compartidos.length === 0){
      listCard.appendChild(el('<div class="empty-state"><div class="big">Aun no hay nadie anotado</div>Agrega participantes arriba.</div>'));
    } else {
      var tbl = document.createElement("table");
      tbl.className = "admin";
      tbl.innerHTML = '<thead><tr><th>Nombre</th><th>Motivo</th><th></th></tr></thead>';
      var tbody = document.createElement("tbody");
      state.compartidos.forEach(function(p){
        var tr = document.createElement("tr");
        tr.innerHTML = '<td>'+escapeHtml(p.nombre)+'</td><td>'+escapeHtml(p.tipo)+'</td><td><button class="btn-danger">Quitar</button></td>';
        tr.querySelector("button").onclick = function(){
          state.compartidos = state.compartidos.filter(function(x){ return x.id !== p.id; });
          persist("compartidos");
          render();
        };
        tbody.appendChild(tr);
      });
      tbl.appendChild(tbody);
      listCard.appendChild(tbl);

      var actions = document.createElement("div");
      actions.style.cssText = "display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;";
      var btnSorteo = el('<button class="btn btn-primary">Sortear ganadora</button>');
      var btnLimpiar = el('<button class="btn btn-ghost">Vaciar lista</button>');
      btnSorteo.onclick = function(){ openSorteo(state.compartidos, "Sorteo"); };
      btnLimpiar.onclick = function(){
        state.compartidos = [];
        persist("compartidos");
        render();
      };
      actions.appendChild(btnSorteo);
      actions.appendChild(btnLimpiar);
      listCard.appendChild(actions);
    }
    wrap.appendChild(listCard);
    return wrap;
  }

  function openSorteo(listaParam, tituloParam){
    var lista = listaParam || state.compartidos;
    var titulo = tituloParam || "Sorteo";
    if(lista.length === 0) return;
    var ganadora = lista[Math.floor(Math.random() * lista.length)];

    var overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.innerHTML =
      '<div class="boleta-wrap">' +
        '<div class="boleta" style="text-align:center;">' +
          '<img class="boleta-logo" src="'+getLogoSrc()+'" alt="">' +
          '<h3>'+escapeHtml(titulo)+' ✿</h3>' +
          '<div class="sub">'+lista.length+' participantes</div>' +
          '<hr>' +
          '<div style="font-family:\'Fraunces\',serif; font-size:1.6rem; font-weight:700; color:var(--brick); margin:18px 0;">'+escapeHtml(ganadora.nombre)+'</div>' +
          '<div class="muted" style="font-size:0.85rem;">'+escapeHtml(ganadora.tipo)+'</div>' +
          '<div class="thanks">¡Felicidades! ✿</div>' +
        '</div>' +
        '<div class="overlay-actions">' +
          '<button class="btn btn-ghost" id="btnCerrarSorteo">Cerrar</button>' +
          '<button class="btn btn-primary" id="btnOtraVez">Sortear otra vez</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(overlay);
    overlay.querySelector("#btnCerrarSorteo").onclick = function(){ overlay.remove(); };
    overlay.querySelector("#btnOtraVez").onclick = function(){ overlay.remove(); openSorteo(lista, titulo); };
    overlay.onclick = function(e){ if(e.target === overlay) overlay.remove(); };
  }

  /* ---------- utilidades ---------- */
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function escapeAttr(s){ return escapeHtml(s); }

  /* ---------- init ---------- */
  document.getElementById("btnExportar").addEventListener("click", function(){ exportExcel(); });
  document.getElementById("btnImportarTrigger").addEventListener("click", function(){
    document.getElementById("fileImportar").click();
  });
  document.getElementById("fileImportar").addEventListener("change", function(e){
    var file = e.target.files[0];
    if(file) importExcelFile(file);
    e.target.value = "";
  });
  document.getElementById("btnImagenes").addEventListener("click", function(){ abrirPanelImagenes(); });
  document.getElementById("btnGuardarCopia").addEventListener("click", function(){ guardarCopiaCompleta(); });
  document.getElementById("btnCargarCopiaTrigger").addEventListener("click", function(){
    document.getElementById("fileCopia").click();
  });
  document.getElementById("fileCopia").addEventListener("change", function(e){
    var file = e.target.files[0];
    e.target.value = "";
    if(file) cargarCopiaCompleta(file);
  });
  document.getElementById("btnGuardarNube").addEventListener("click", function(){ guardarEnLaNube(); });
  document.getElementById("btnCargarNube").addEventListener("click", function(){ cargarDeLaNube(); });

  function construirCopiaCompleta(){
    return {
      tipo: "tienditas_kiara_copia",
      version: 1,
      fecha: new Date().toISOString(),
      config: state.config,
      productos: state.productos,
      clientes: state.clientes,
      zonas: state.zonas,
      ventas: state.ventas,
      live: state.live,
      liveDescuentos: state.liveDescuentos,
      compartidos: state.compartidos
    };
  }

  function aplicarCopiaCompleta(copia){
    if(!copia || copia.tipo !== "tienditas_kiara_copia") return false;
    state.config = copia.config || state.config;
    state.productos = copia.productos || [];
    state.clientes = copia.clientes || [];
    state.zonas = (copia.zonas && copia.zonas.length) ? copia.zonas : defaultZonas();
    state.ventas = copia.ventas || [];
    state.live = copia.live || [];
    state.liveDescuentos = copia.liveDescuentos || {};
    state.compartidos = copia.compartidos || [];
    persist("config"); persist("productos"); persist("clientes"); persist("zonas");
    persist("ventas"); persist("live"); persist("liveDescuentos"); persist("compartidos");
    document.getElementById("shopname").textContent = state.config.tienda;
    render();
    return true;
  }

  function guardarCopiaCompleta(){
    var copia = construirCopiaCompleta();
    var blob = new Blob([JSON.stringify(copia)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    var fecha = fechaLocalYYYYMMDD(new Date());
    a.href = url;
    a.download = (state.config.tienda || "tienda").replace(/[^a-z0-9]+/gi,"_") + "_copia_" + fecha + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    showToast("Copia guardada. Comparte ese archivo o guardalo para abrirlo en otro computador.");
  }

  function cargarCopiaCompleta(file){
    var reader = new FileReader();
    reader.onload = function(e){
      var copia;
      try { copia = JSON.parse(e.target.result); }
      catch(err){ showToast("Ese archivo no es una copia valida"); return; }
      if(aplicarCopiaCompleta(copia)){
        showToast("Copia cargada, aqui esta todo lo que tenias");
      } else {
        showToast("Ese archivo no es una copia valida");
      }
    };
    reader.readAsText(file);
  }

  // ---------- Firebase (guardar/cargar en la nube, solo manual) ----------
  function inicializarFirebase(){
    if(typeof firebase === "undefined") return null;
    if(!window.FIREBASE_CONFIG || !window.FIREBASE_CONFIG.apiKey || window.FIREBASE_CONFIG.apiKey.indexOf("PEGA_AQUI") === 0){
      return null;
    }
    try{
      if(!firebase.apps || !firebase.apps.length){
        firebase.initializeApp(window.FIREBASE_CONFIG);
      }
      return firebase.firestore();
    } catch(e){
      return null;
    }
  }

  function guardarEnLaNube(){
    var db = inicializarFirebase();
    if(!db){ showToast("Falta configurar firebase-config.js con los datos de tu proyecto"); return; }
    var ruta = window.FIREBASE_DOC_PATH || { collection: "tienditas_kiara", doc: "datos" };
    showToast("Guardando en la nube...");
    db.collection(ruta.collection).doc(ruta.doc).set(construirCopiaCompleta())
      .then(function(){ showToast("Guardado en la nube ✓ ya puede buscarse online"); })
      .catch(function(err){ showToast("No se pudo guardar en la nube: " + (err && err.message ? err.message : "revisa la conexion")); });
  }

  function cargarDeLaNube(){
    var db = inicializarFirebase();
    if(!db){ showToast("Falta configurar firebase-config.js con los datos de tu proyecto"); return; }
    var ruta = window.FIREBASE_DOC_PATH || { collection: "tienditas_kiara", doc: "datos" };
    showToast("Cargando desde la nube...");
    db.collection(ruta.collection).doc(ruta.doc).get()
      .then(function(snap){
        if(!snap.exists){ showToast("Aun no hay nada guardado en la nube"); return; }
        if(aplicarCopiaCompleta(snap.data())){
          showToast("Datos traidos desde la nube");
        } else {
          showToast("Los datos guardados en la nube no son validos");
        }
      })
      .catch(function(err){ showToast("No se pudo cargar: " + (err && err.message ? err.message : "revisa la conexion")); });
  }

  function refrescarImagenesHeader(){
    var hl = document.getElementById("headerLogo");
    var hm = document.getElementById("headerMascota");
    if(hl){ hl.style.display = ""; hl.src = getLogoSrc(); }
    if(hm){ hm.style.display = ""; hm.src = getMascota1Src(); }
  }

  function leerComoDataUri(file, cb){
    var reader = new FileReader();
    reader.onload = function(e){ cb(e.target.result); };
    reader.readAsDataURL(file);
  }

  function abrirPanelImagenes(){
    var overlay = document.createElement("div");
    overlay.className = "overlay";

    function fila(id, label, srcActual, esExterna){
      return '<div class="img-config-row">' +
        '<img class="img-config-preview" src="'+srcActual+'" onerror="this.style.opacity=\'0.15\'">' +
        '<div class="img-config-info"><b>'+label+'</b>' +
          (esExterna ? '<span class="img-config-warn">Desde archivo local (puede bloquear "Copiar imagen")</span>' : '<span class="img-config-ok">Guardada, lista para copiar</span>') +
        '</div>' +
        '<button class="btn btn-ghost btn-sm" data-id="'+id+'">Subir</button>' +
      '</div>';
    }

    overlay.innerHTML =
      '<div class="boleta-wrap">' +
        '<div class="boleta" style="text-align:left;">' +
          '<h3 style="text-align:center;">Imagenes</h3>' +
          '<div class="sub" style="text-align:center;">Subelas una vez desde tu computador y quedan guardadas aqui mismo, asi "Copiar imagen" de la boleta funciona siempre, sin importar la carpeta.</div>' +
          '<hr>' +
          fila("logo", "Logo de la tienda", getLogoSrc(), !state.config.logoDataUri) +
          fila("mascota1", "Mascota (arriba, junto al nombre)", getMascota1Src(), !state.config.mascota1DataUri) +
          fila("mascota2", "Mascota (abajo de la boleta)", getMascota2Src(), !state.config.mascota2DataUri) +
          '<input type="file" id="imgConfigFile" accept="image/*" style="display:none;">' +
        '</div>' +
        '<div class="overlay-actions">' +
          '<button class="btn btn-ghost" id="btnCerrarImagenes">Cerrar</button>' +
        '</div>' +
      '</div>';

    document.body.appendChild(overlay);
    overlay.onclick = function(e){ if(e.target === overlay) overlay.remove(); };
    overlay.querySelector("#btnCerrarImagenes").onclick = function(){ overlay.remove(); };

    var fileInput = overlay.querySelector("#imgConfigFile");
    var targetId = null;
    overlay.querySelectorAll("[data-id]").forEach(function(btn){
      btn.addEventListener("click", function(){
        targetId = btn.getAttribute("data-id");
        fileInput.click();
      });
    });
    fileInput.addEventListener("change", function(e){
      var file = e.target.files[0];
      e.target.value = "";
      if(!file || !targetId) return;
      leerComoDataUri(file, function(dataUri){
        if(targetId === "logo") state.config.logoDataUri = dataUri;
        if(targetId === "mascota1") state.config.mascota1DataUri = dataUri;
        if(targetId === "mascota2") state.config.mascota2DataUri = dataUri;
        persist("config");
        refrescarImagenesHeader();
        showToast("Imagen guardada");
        overlay.remove();
        abrirPanelImagenes();
      });
    });
  }

  var appEl = document.getElementById("app");
  appEl.style.opacity = "0.4";

  var landingEl = document.getElementById("landingScreen");
  var landingDateEl = document.getElementById("landingDate");
  var diasSemana = ["Domingo","Lunes","Martes","Miercoles","Jueves","Viernes","Sabado"];
  var meses = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
  var hoyPC = new Date();
  landingDateEl.textContent = diasSemana[hoyPC.getDay()] + " " + hoyPC.getDate() + " de " + meses[hoyPC.getMonth()] + ", " + hoyPC.getFullYear();

  function cerrarLanding(){
    landingEl.style.display = "none";
  }
  document.getElementById("btnLandingLive").addEventListener("click", function(){
    cerrarLanding();
  });
  document.getElementById("btnLandingSkip").addEventListener("click", function(){
    cerrarLanding();
  });
  document.getElementById("btnLandingImport").addEventListener("click", function(){
    cerrarLanding();
    document.getElementById("fileImportar").click();
  });

  loadAll().then(function(){
    document.getElementById("shopname").textContent = state.config.tienda;
    refrescarImagenesHeader();
    appEl.style.opacity = "1";
    render();
    if(document.fonts && document.fonts.ready){
      document.fonts.ready.then(function(){
        if(tab === "vender") render();
      });
    }
  });

})();
