<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buscar mi boleta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="img/Logo tienditas kiara.png">
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<style>
  :root{
    --paper:#FBE9F2;
    --card:#FFFFFF;
    --ink:#5B2A4D;
    --ink-soft:#9C6E93;
    --brick:#C15B95;
    --brick-dark:#9E3F78;
    --mustard:#F7AFCE;
    --line:#F3CFE3;
    --shadow: 0 1px 2px rgba(91,42,77,0.08), 0 10px 26px -10px rgba(155,64,120,0.28);
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink); font-family:'Public Sans', sans-serif;
    font-size:17px; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:820px; margin:0 auto; padding:28px 16px 90px;}
  .brand{display:flex; align-items:center; gap:12px; justify-content:center; margin-bottom:6px;}
  .brand img{width:52px; height:52px; border-radius:50%; object-fit:cover; border:2px solid var(--mustard); background:#fff;}
  .brand h1{font-family:'Fraunces',serif; font-size:1.9rem; margin:0; text-align:center;}
  .tagline{text-align:center; color:var(--ink-soft); font-size:0.95rem; margin-bottom:28px;}
  .card{
    background:var(--card); border:2px dashed var(--line); border-radius:var(--radius);
    padding:22px; box-shadow:var(--shadow); margin-bottom:18px;
  }
  .search-field{position:relative;}
  input[type=text]{
    width:100%; padding:14px 16px; border-radius:12px; border:1.5px solid var(--line);
    background:#FFFCFE; color:var(--ink); font-size:1.05rem; font-family:'Public Sans', sans-serif;
    outline:none;
  }
  input[type=text]:focus{border-color:var(--brick); box-shadow:0 0 0 3px rgba(181,68,44,0.12);}
  .estado{text-align:center; color:var(--ink-soft); font-size:0.92rem; margin:18px 0;}
  .cliente-grupo{margin-bottom:22px;}
  .cliente-grupo h2{font-family:'Fraunces',serif; font-size:1.25rem; margin:0 0 10px; color:var(--brick-dark);}
  .boleta-mini{
    background:#FFFDFE; border:1.5px dashed var(--line); border-radius:12px; padding:16px 18px; margin-bottom:12px;
  }
  .boleta-mini .fila-top{display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:8px; flex-wrap:wrap;}
  .boleta-mini .fecha{font-size:0.82rem; color:var(--ink-soft);}
  .boleta-mini .total{font-family:'Space Mono',monospace; font-weight:700; font-size:1.05rem;}
  .boleta-mini table{width:100%; border-collapse:collapse; margin-top:6px;}
  .boleta-mini td{padding:4px 2px; font-size:0.9rem; border-bottom:1px dashed var(--line);}
  .boleta-mini td.num{text-align:right; font-family:'Space Mono',monospace; white-space:nowrap;}
  .boleta-mini .resumen{margin-top:8px; font-size:0.88rem; color:var(--ink-soft); display:flex; justify-content:space-between;}
  .boleta-mini .resumen b{color:var(--ink);}
  .vacio{text-align:center; padding:40px 20px; color:var(--ink-soft);}
  .vacio .big{font-family:'Fraunces',serif; font-size:1.3rem; color:var(--ink); margin-bottom:6px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <img src="img/Logo tienditas kiara.png" alt="" onerror="this.style.display='none'">
    <h1 id="nombreTienda">Tienditas Kiara</h1>
  </div>
  <div class="tagline">Busca tu nombre para ver tus boletas y fechas de compra</div>

  <div class="card">
    <div class="search-field">
      <input type="text" id="buscador" placeholder="Escribe tu nombre..." autocomplete="off">
    </div>
  </div>

  <div id="resultados"></div>
</div>

<script>
(function(){
  "use strict";

  var ventas = [];
  var nombreTienda = "Tienditas Kiara";
  var listo = false;

  function escapeHtml(s){
    s = (s == null) ? "" : String(s);
    return s.replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function money(n){
    n = Math.round(Number(n)||0);
    return "$" + n.toLocaleString("es-CL");
  }

  function pintarEstado(texto){
    document.getElementById("resultados").innerHTML = '<div class="estado">'+escapeHtml(texto)+'</div>';
  }

  function pintarResultados(filtro){
    var cont = document.getElementById("resultados");
    var f = filtro.trim().toLowerCase();
    if(!f){
      cont.innerHTML = '<div class="vacio"><div class="big">Escribe tu nombre arriba</div>Te vamos a mostrar todas tus boletas.</div>';
      return;
    }
    var coincidencias = ventas.filter(function(v){
      return (v.clienteNombre || "").toLowerCase().indexOf(f) !== -1;
    });
    if(coincidencias.length === 0){
      cont.innerHTML = '<div class="vacio"><div class="big">Sin resultados</div>No encontramos boletas para "'+escapeHtml(filtro)+'".</div>';
      return;
    }
    // agrupar por nombre exacto de clienta (puede haber varias con nombres parecidos)
    var grupos = {};
    var orden = [];
    coincidencias.forEach(function(v){
      var key = v.clienteNombre || "Sin nombre";
      if(!grupos[key]){ grupos[key] = []; orden.push(key); }
      grupos[key].push(v);
    });

    var html = "";
    orden.forEach(function(nombre){
      var lista = grupos[nombre].slice().sort(function(a,b){
        return new Date(b.fecha) - new Date(a.fecha);
      });
      html += '<div class="cliente-grupo"><h2>'+escapeHtml(nombre)+' ('+lista.length+' boleta'+(lista.length>1?'s':'')+')</h2>';
      lista.forEach(function(v){
        var d = new Date(v.fecha);
        var fechaTxt = d.toLocaleDateString("es-CL") + " " + d.toLocaleTimeString("es-CL",{hour:"2-digit",minute:"2-digit"});
        var filas = (v.items||[]).map(function(it){
          return '<tr><td>'+it.cantidad+'x '+escapeHtml(it.nombre)+'</td><td class="num">'+money(it.precio*it.cantidad)+'</td></tr>';
        }).join("");
        html +=
          '<div class="boleta-mini">' +
            '<div class="fila-top"><span class="fecha">'+fechaTxt+'</span><span class="total">'+money(v.total)+'</span></div>' +
            '<table>'+filas+'</table>' +
            '<div class="resumen"><span>Delivery: '+escapeHtml(v.zonaNombre||"-")+ (v.descuento>0 ? ' &middot; Descuento: -'+money(v.descuento) : '') +'</span><b>Total '+money(v.total)+'</b></div>' +
          '</div>';
      });
      html += '</div>';
    });
    cont.innerHTML = html;
  }

  document.getElementById("buscador").addEventListener("input", function(e){
    if(!listo) return;
    pintarResultados(e.target.value);
  });

  function iniciar(){
    if(typeof firebase === "undefined" || !window.FIREBASE_CONFIG || !window.FIREBASE_CONFIG.apiKey || window.FIREBASE_CONFIG.apiKey.indexOf("PEGA_AQUI") === 0){
      pintarEstado("Esta pagina todavia no esta conectada. Falta configurar firebase-config.js.");
      return;
    }
    try{
      if(!firebase.apps || !firebase.apps.length){ firebase.initializeApp(window.FIREBASE_CONFIG); }
    } catch(e){}
    var db = firebase.firestore();
    var ruta = window.FIREBASE_DOC_PATH || { collection: "tienditas_kiara", doc: "datos" };
    pintarEstado("Buscando boletas...");
    db.collection(ruta.collection).doc(ruta.doc).get().then(function(snap){
      if(!snap.exists){
        pintarEstado("Todavia no hay boletas guardadas.");
        return;
      }
      var datos = snap.data();
      ventas = datos.ventas || [];
      if(datos.config && datos.config.tienda){
        nombreTienda = datos.config.tienda;
        document.getElementById("nombreTienda").textContent = nombreTienda;
        document.title = "Buscar mi boleta - " + nombreTienda;
      }
      listo = true;
      pintarResultados(document.getElementById("buscador").value);
    }).catch(function(err){
      pintarEstado("No se pudo conectar. Intenta de nuevo mas tarde.");
    });
  }

  iniciar();
})();
</script>
</body>
</html>
